<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Passthrough Schießstand</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #info {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);

      max-width: 92vw; pointer-events: none;
    }

    #status {
      position: absolute; bottom: 70px; left: 16px; color: #fff; background: rgba(0,0,0,.55);

    #camBtn {
      position: absolute; bottom: 20px; right: 16px; padding: 10px 14px; border-radius: 8px; border: 1px solid #fff;
      background: rgba(0,0,0,.6); color: #fff; font: 13px system-ui, sans-serif; cursor: pointer; max-width: 42vw;
    }
    #crosshair {
      position: absolute; left: 0; top: 0; width: 6px; height: 6px; margin: -3px 0 0 -3px;
      border-radius: 50%; background: rgba(255,255,255,.8); pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

    PC-Test: 1–4 Waffe · Linksklick schießen · Rechte Maustaste ziehen = umschauen · Leertaste = Visier · R nachladen · V Feuermodus · F Messer werfen · Mausrad Zoom

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // =========================================================================
    // Einstellungen
    // =========================================================================
    const ROUND_TIME = 75;          // Sekunden pro Runde
    const MAX_TARGETS = 3;          // gleichzeitig sichtbare Zielscheiben
    const TARGET_RADIUS = 0.25;     // Meter
    const RING_POINTS = [10, 8, 6, 4, 2]; // von innen nach außen
    const HOLD_OFFSET = new THREE.Matrix4().makeTranslation(0, -0.045, 0.015); // Handmitte relativ zum Controller

    const WEAPON_ORDER = ['pistol', 'smg', 'shotgun', 'sniper'];
    const WEAPON_DEFS = {
      pistol: {
        name: 'Pistole P9', desc: '15 Schuss · Halbautomat · Kimme & Korn',
        twoHand: false, capacity: 15, feed: 'mag', action: 'slide', autoCycle: true, holdOpen: true,
        modes: ['semi'], startMode: 0, rpm: 450, spread: 0.002, pellets: 1,
        recoil: { back: 0.035, rise: 0.32, jitter: 0.02 }, travel: 0.045, sight: 'iron',
        range: [2.5, 6], scoreMult: 1, grip: [-0.028, -0.03], snd: { cut: 4200, thump: 140, vol: 0.85 }
      },
      smg: {
        name: 'Maschinenpistole MPX', desc: '30 Schuss · Einzel/Dauerfeuer · Rotpunkt',
        twoHand: true, capacity: 30, feed: 'mag', action: 'charge', autoCycle: true, holdOpen: true,
        modes: ['safe', 'semi', 'auto'], startMode: 1, rpm: 800, spread: 0.003, pellets: 1,
        recoil: { back: 0.016, rise: 0.09, jitter: 0.04 }, travel: 0.065, sight: 'reddot',

      },
      shotgun: {

        twoHand: true, capacity: 6, feed: 'tube', action: 'pump', autoCycle: false, holdOpen: false,
        modes: ['safe', 'semi'], startMode: 1, rpm: 150, spread: 0.04, pellets: 9,
        recoil: { back: 0.06, rise: 0.42, jitter: 0.03 }, travel: 0.08, sight: 'bead',

      },
      sniper: {
        name: 'Scharfschützengewehr', desc: '5 Schuss · Repetierer · Zielfernrohr 4–12x',
        twoHand: true, capacity: 5, feed: 'mag', action: 'bolt', autoCycle: false, holdOpen: false,
        modes: ['safe', 'semi'], startMode: 1, rpm: 70, spread: 0.0004, pellets: 1,
        recoil: { back: 0.05, rise: 0.22, jitter: 0.01 }, travel: 0.085, sight: 'scope',
        range: [7, 16], scoreMult: 1.5, grip: [-0.04, -0.045], snd: { cut: 3000, thump: 70, vol: 1.0 }
      }
    };

    // =========================================================================
    // Grundgerüst
    // =========================================================================
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0); // transparent -> Passthrough sichtbar
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const desktopBackground = new THREE.Color(0x30343c);
    const scopeBackground = new THREE.Color(0x2b3a31);
    scene.background = desktopBackground;
    // Umgebungs-Spiegelungen für Metall
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 200);
    camera.position.set(0, 1.6, 0);
    scene.add(camera);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x666677, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(1, 3, 2);
    scene.add(sun);

    const desktopFloor = new THREE.GridHelper(40, 40, 0x666666, 0x444444);
    scene.add(desktopFloor);

    document.body.appendChild(ARButton.createButton(renderer, { optionalFeatures: ['local-floor'] }));

    const statusEl = document.getElementById('status');
    const crosshairEl = document.getElementById('crosshair');

    renderer.xr.addEventListener('sessionstart', () => {
      scene.background = null;
      desktopFloor.visible = false;
      ensureAudio();
      if (W) { if (W.root.parent) W.root.parent.remove(W.root); W = null; } // Waffe in VR neu von der Wand nehmen
      setTimeout(placeMenu, 300);
    });
    renderer.xr.addEventListener('sessionend', () => {
      scene.background = desktopBackground;
      desktopFloor.visible = true;
      camera.position.set(0, 1.6, 0);
      if (W) { camera.add(W.root); W.root.quaternion.identity(); W.hand = -1; }
      for (const h of hands) clearHand(h);
      while (looseWeapons.length) scene.remove(looseWeapons.pop().inst.root);
      placeMenu();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // Audio (synthetisch)
    // =========================================================================
    let audioCtx = null, noiseBuffer = null;
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.6, audioCtx.sampleRate);
        const d = noiseBuffer.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('pointerdown', ensureAudio);
    document.addEventListener('keydown', ensureAudio);

    function noise(t, dur, vol, type, f0, f1, q = 1) {
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = type;
      filter.Q.value = q;
      filter.frequency.setValueAtTime(f0, t);
      filter.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(filter).connect(g).connect(audioCtx.destination);
      src.start(t);
      src.stop(t + dur + 0.02);
    }
    function tone(t, f0, f1, dur, vol, type = 'sine') {
      const osc = audioCtx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }
    const SFX = {
      shot(def) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime, s = def.snd;
        noise(t, 0.35, s.vol, 'lowpass', s.cut, 250);
        noise(t, 0.05, s.vol * 0.6, 'highpass', 3000, 2000);
        tone(t, s.thump, 35, 0.2, s.vol * 0.9);
      },
      click(f = 2500, vol = 0.35, dur = 0.03) { if (!audioCtx) return; noise(audioCtx.currentTime, dur, vol, 'bandpass', f, f * 0.8, 6); },
      dry() { SFX.click(3500, 0.3, 0.025); },
      magOut() { if (!audioCtx) return; const t = audioCtx.currentTime; noise(t, 0.04, 0.4, 'bandpass', 1800, 1200, 4); noise(t + 0.05, 0.08, 0.2, 'bandpass', 900, 600, 3); },
      magIn() { if (!audioCtx) return; const t = audioCtx.currentTime; noise(t, 0.03, 0.4, 'bandpass', 1400, 1000, 4); noise(t + 0.03, 0.05, 0.6, 'bandpass', 2600, 2000, 5); },
      rackBack() { if (!audioCtx) return; const t = audioCtx.currentTime; noise(t, 0.06, 0.45, 'bandpass', 1600, 2600, 3); },
      rackFwd() { if (!audioCtx) return; const t = audioCtx.currentTime; noise(t, 0.05, 0.55, 'bandpass', 2600, 1500, 3); noise(t + 0.02, 0.04, 0.4, 'bandpass', 4000, 3500, 6); },
      shellIn() { if (!audioCtx) return; const t = audioCtx.currentTime; noise(t, 0.05, 0.4, 'bandpass', 1200, 900, 4); },
      selector() { SFX.click(4200, 0.25, 0.02); },
      grab() { SFX.click(800, 0.2, 0.03); },
      hit(pts) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        if (pts >= 10) [880, 1175, 1568].forEach((f, i) => tone(t + i * 0.06, f, f, 0.3, 0.25));
        else tone(t, 660 + pts * 30, 660 + pts * 30, 0.2, 0.22);
      },
      jingle(freqs, dur = 0.25) { if (!audioCtx) return; const t = audioCtx.currentTime; freqs.forEach((f, i) => tone(t + i * 0.09, f, f, dur, 0.22)); },
      beep() { if (!audioCtx) return; tone(audioCtx.currentTime, 1000, 1000, 0.08, 0.12, 'square'); },
      casing() { if (!audioCtx) return; const t = audioCtx.currentTime; tone(t, 5200 + Math.random() * 1500, 4800, 0.08, 0.03, 'triangle'); }
    };

    // =========================================================================
    // Hilfsfunktionen
    // =========================================================================
    function makePanel(widthM, heightM, pxPerM = 600) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(widthM * pxPerM);
      canvas.height = Math.round(heightM * pxPerM);
      const ctx = canvas.getContext('2d');
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(widthM, heightM),
        new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false, toneMapped: false })
      );
      return { mesh, canvas, ctx, draw(fn) { ctx.clearRect(0, 0, canvas.width, canvas.height); fn(ctx, canvas.width, canvas.height); texture.needsUpdate = true; } };
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function panelBg(ctx, w, h, r = 30, border = '#ffcc33') {
      roundRect(ctx, 3, 3, w - 6, h - 6, r);
      ctx.fillStyle = 'rgba(12,16,24,0.85)';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = border;
      ctx.stroke();
    }

    // ---- Materialien --------------------------------------------------------
    function woodTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#8a5129';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 70; i++) {
        const y = Math.random() * 256;
        ctx.strokeStyle = `rgba(${40 + Math.random() * 30},${18 + Math.random() * 12},5,${0.15 + Math.random() * 0.3})`;
        ctx.lineWidth = 0.5 + Math.random() * 2.5;
        ctx.beginPath();
        for (let x = 0; x <= 256; x += 16) ctx.lineTo(x, y + Math.sin(x * 0.03 + i) * 4 + Math.random() * 1.5);
        ctx.stroke();
      }
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(4, 12);
      return t;
    }
    function stippleTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 128, 128);
      for (let i = 0; i < 1400; i++) {
        ctx.fillStyle = Math.random() < 0.5 ? '#5a5a5a' : '#a8a8a8';
        ctx.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
      }
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(60, 60);
      return t;
    }
    const stipple = stippleTexture();
    const MAT = {
      steel: new THREE.MeshStandardMaterial({ color: 0x2a2d31, metalness: 0.85, roughness: 0.32 }),
      blued: new THREE.MeshStandardMaterial({ color: 0x1d2330, metalness: 0.9, roughness: 0.25 }),
      bright: new THREE.MeshStandardMaterial({ color: 0x9aa1a8, metalness: 1.0, roughness: 0.2 }),
      polymer: new THREE.MeshStandardMaterial({ color: 0x1b1c1e, metalness: 0.05, roughness: 0.7 }),
      grip: new THREE.MeshStandardMaterial({ color: 0x232426, metalness: 0.0, roughness: 0.9, bumpMap: stipple, bumpScale: 1.5 }),
      tan: new THREE.MeshStandardMaterial({ color: 0x8b7d58, metalness: 0.05, roughness: 0.8 }),
      tanGrip: new THREE.MeshStandardMaterial({ color: 0x7d7051, metalness: 0.0, roughness: 0.95, bumpMap: stipple, bumpScale: 1.5 }),
      wood: new THREE.MeshStandardMaterial({ map: woodTexture(), metalness: 0.0, roughness: 0.45 }),
      rubber: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 }),
      black: new THREE.MeshStandardMaterial({ color: 0x070707, roughness: 0.6 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xd4a83a, metalness: 1.0, roughness: 0.25 }),
      copper: new THREE.MeshStandardMaterial({ color: 0xb8673a, metalness: 1.0, roughness: 0.3 }),
      shellRed: new THREE.MeshStandardMaterial({ color: 0xa3161b, roughness: 0.45 }),
      dotGreen: new THREE.MeshBasicMaterial({ color: 0x55ff66, toneMapped: false }),
      dotWhite: new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }),
      dotOrange: new THREE.MeshBasicMaterial({ color: 0xff9a2a, toneMapped: false }),
      glass: new THREE.MeshStandardMaterial({ color: 0x5577aa, metalness: 1, roughness: 0.05, transparent: true, opacity: 0.25, depthWrite: false })
    };

    // ---- Geometrie-Bausteine (Design-Koordinaten: s = vorwärts, y = oben) -----
    function profileGeo(pts, width, bevel = 0.0015, holes) {
      const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
      if (holes) for (const h of holes) shape.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1]))));
      const depth = Math.max(0.0005, width - 2 * bevel);
      const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 6 });
      g.rotateY(Math.PI / 2);
      g.translate(-depth / 2, 0, 0);
      return g;
    }
    const prof = (pts, width, mat, bevel, holes) => new THREE.Mesh(profileGeo(pts, width, bevel, holes), mat);
    function box(w, h, l, mat, s, y, x = 0) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), mat);
      m.position.set(x, y, -s);
      return m;
    }
    function cylZ(rFront, rRear, len, mat, s, y, x = 0, seg = 20, open = false) {
      const g = new THREE.CylinderGeometry(rRear, rFront, len, seg, 1, open);
      g.rotateX(Math.PI / 2);
      const m = new THREE.Mesh(g, mat);
      m.position.set(x, y, -s);
      return m;
    }
    function cylY(rTop, rBot, len, mat, s, y, x = 0, seg = 16) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, len, seg), mat);
      m.position.set(x, y, -s);
      return m;
    }
    function cylX(r, len, mat, s, y, x = 0, seg = 16) {
      const g = new THREE.CylinderGeometry(r, r, len, seg);
      g.rotateZ(Math.PI / 2);
      const m = new THREE.Mesh(g, mat);
      m.position.set(x, y, -s);
      return m;
    }
    function sphere(r, mat, s, y, x = 0) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), mat);
      m.position.set(x, y, -s);
      return m;
    }

    // ---- Munition ----------------------------------------------------------
    function makeCartridge(rifle = false) {
      const g = new THREE.Group();
      const len = rifle ? 0.05 : 0.02, r = rifle ? 0.0045 : 0.0045;
      g.add(cylY(r, r, len, MAT.brass, 0, 0));
      const tip = new THREE.Mesh(new THREE.ConeGeometry(r * 0.9, rifle ? 0.018 : 0.008, 10), MAT.copper);
      tip.position.y = len / 2 + (rifle ? 0.009 : 0.004);
      g.add(tip);
      return g;
    }
    function makeCasing(rifle = false) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, rifle ? 0.05 : 0.02, 10), MAT.brass);
      return m;
    }
    function makeShell(spent = false) {
      const g = new THREE.Group();
      g.add(cylY(0.0095, 0.0095, 0.052, MAT.shellRed, 0, 0.008));
      g.add(cylY(0.0101, 0.0101, 0.016, MAT.brass, 0, -0.026));
      if (spent) g.add(cylY(0.007, 0.007, 0.001, MAT.black, 0, 0.0345));
      return g;
    }

    // =========================================================================
    // Waffenmodelle
    // =========================================================================
    // Jede Bau-Funktion bekommt: m = Modellgruppe, P = bewegliche Teile, sock = Ankerpunkte
    const BUILDERS = {
      pistol(m, P, sock) {
        // Rahmen
        m.add(prof([[-0.03, 0.036], [0.15, 0.036], [0.15, 0.024], [0.08, 0.022], [0.065, 0.017], [0.0, 0.017], [-0.03, 0.026]], 0.024, MAT.polymer));
        m.add(box(0.02, 0.005, 0.06, MAT.polymer, 0.115, 0.02));
        // Abzugsbügel
        m.add(prof([[0.0, 0.02], [0.068, 0.02], [0.068, 0.008], [0.058, -0.012], [0.008, -0.012], [-0.002, 0.0]], 0.011, MAT.polymer, 0.001,
          [[[0.008, 0.016], [0.06, 0.016], [0.06, 0.008], [0.052, -0.006], [0.012, -0.006], [0.006, 0.002]]]));
        const trig = box(0.006, 0.019, 0.005, MAT.steel, 0.032, 0.008);
        trig.rotation.x = 0.25;
        m.add(trig);
        // Griff
        m.add(prof([[-0.038, 0.03], [0.004, 0.026], [-0.002, 0.0], [-0.013, -0.084], [-0.058, -0.08], [-0.052, -0.02], [-0.048, 0.022]], 0.029, MAT.grip, 0.003));
        // Schlitten (beweglich)
        const slide = new THREE.Group();
        m.add(slide);
        P.charger = slide;
        slide.add(prof([[-0.035, 0.036], [0.155, 0.036], [0.155, 0.06], [0.149, 0.068], [-0.03, 0.068], [-0.035, 0.062]], 0.025, MAT.steel));
        for (let i = 0; i < 6; i++) {
          slide.add(box(0.0262, 0.022, 0.0016, MAT.black, -0.03 + i * 0.0045, 0.052));
          slide.add(box(0.0262, 0.022, 0.0016, MAT.black, 0.118 + i * 0.0045, 0.052));
        }
        slide.add(box(0.004, 0.013, 0.032, MAT.black, 0.045, 0.058, 0.0112));
        slide.add(box(0.003, 0.011, 0.03, MAT.bright, 0.045, 0.058, 0.0098));
        slide.add(cylZ(0.0062, 0.0062, 0.004, MAT.bright, 0.156, 0.05));
        slide.add(cylZ(0.0042, 0.0042, 0.0045, MAT.black, 0.1565, 0.05));
        // Kimme mit 2 Leuchtpunkten, Korn mit grünem Punkt
        slide.add(box(0.017, 0.004, 0.008, MAT.black, -0.022, 0.07));
        slide.add(box(0.006, 0.007, 0.006, MAT.black, -0.022, 0.0745, 0.0055));
        slide.add(box(0.006, 0.007, 0.006, MAT.black, -0.022, 0.0745, -0.0055));
        slide.add(sphere(0.0012, MAT.dotWhite, -0.0255, 0.0745, 0.0055));
        slide.add(sphere(0.0012, MAT.dotWhite, -0.0255, 0.0745, -0.0055));
        slide.add(box(0.003, 0.009, 0.005, MAT.black, 0.142, 0.0715));
        slide.add(sphere(0.0014, MAT.dotGreen, 0.1395, 0.0735));
        sock('sightRear', -0.022, 0.0765);
        sock('sightFront', 0.142, 0.0765);
        sock('muzzle', 0.16, 0.05);
        sock('eject', 0.045, 0.064, 0.016);
        sock('chargerGrab', -0.02, 0.052);
        const seat = sock('magSeat', -0.026, 0.024);
        seat.rotation.x = -0.14;
        sock('magwell', -0.036, -0.083);
      },

    // ---- Zielfernrohr: Render-Target + Fadenkreuz ---------------------------
    const scopeRT = new THREE.WebGLRenderTarget(512, 512, { samples: 2 });
    scopeRT.texture.colorSpace = THREE.SRGBColorSpace;
    const scopeCam = new THREE.PerspectiveCamera(4, 1, 0.1, 200);
    const reticleTexture = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(256, 256, 200, 256, 256, 256);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.95)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 6;
      for (const [x0, y0, x1, y1] of [[0, 256, 200, 256], [312, 256, 512, 256], [256, 0, 256, 200], [256, 312, 256, 512]]) {
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(200, 256); ctx.lineTo(312, 256); ctx.moveTo(256, 200); ctx.lineTo(256, 312); ctx.stroke();
      ctx.fillStyle = '#000';
      for (let i = 1; i <= 4; i++) {
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          ctx.beginPath(); ctx.arc(256 + dx * i * 22, 256 + dy * i * 22, 3, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.fillStyle = '#ff2a2a';
      ctx.beginPath(); ctx.arc(256, 256, 2.5, 0, Math.PI * 2); ctx.fill();
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();

    function buildWeapon(id) {
      const def = WEAPON_DEFS[id];
      const root = new THREE.Group();
      const body = new THREE.Group();
      root.add(body);
      const model = new THREE.Group();
      body.add(model);
      const parts = {}, sockets = {};
      const sock = (name, s, y, x = 0) => {
        const o = new THREE.Object3D();
        o.position.set(x, y, -s);
        model.add(o);
        sockets[name] = o;
        return o;
      };
      BUILDERS[id](model, parts, sock);
      model.position.set(0, -def.grip[1], def.grip[0]);
      // Magazin einsetzen
      if (def.feed === 'mag') {
        parts.mag = BUILDERS[id + 'Mag']();
        sockets.magSeat.add(parts.mag);
      }
      // Mündungsfeuer
      const flash = new THREE.Group();
      const flashMat = new THREE.MeshBasicMaterial({ color: 0xffc860, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
      const f1 = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.09, 8, 1, true), flashMat);
      f1.rotation.x = -Math.PI / 2;
      f1.position.z = -0.045;
      flash.add(f1);
      const f2 = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), flashMat);
      flash.add(f2);
      flash.visible = false;
      sockets.muzzle.add(flash);
      const light = new THREE.PointLight(0xffaa44, 0, 2);
      sockets.muzzle.add(light);
      parts.flash = flash;
      parts.flashLight = light;
      // Ruhe-Positionen der Anker relativ zur Wurzel (für Zweihand-Griff und Desktop-Zielen)
      const rest = (name) => sockets[name] ? sockets[name].position.clone().add(model.position) : null;
      let foreQ = null;
      if (sockets.foregrip) foreQ = new THREE.Quaternion().setFromUnitVectors(rest('foregrip').normalize(), new THREE.Vector3(0, 0, -1));
      return { root, body, model, parts, sockets, def, foreQ, restSightRear: rest('sightRear') };
    }

    // =========================================================================
    // Controller / Hände
    // =========================================================================
    const hands = [0, 1].map(i => {
      const ray = renderer.xr.getController(i);
      scene.add(ray);
      const h = {
        i, ray, src: null, handedness: i === 0 ? 'left' : 'right', btn: {}, prev: {}, stickY: 0,
        item: null, knife: null, grab: null, consumedTrigger: false,
        hist: [], vel: new THREE.Vector3(), point: new THREE.Vector3()
      };
      ray.addEventListener('connected', (e) => { h.src = e.data; h.handedness = e.data.handedness; });
      ray.addEventListener('disconnected', () => { clearHand(h); h.src = null; });
      // Zeigestrahl (nur wenn die Hand leer ist und es etwas zu greifen gibt)
      const ptr = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -1)]),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
      ptr.scale.z = 3;
      ptr.visible = false;
      ray.add(ptr);
      h.pointer = ptr;
      return h;
    });
    const BTN = { trigger: 0, squeeze: 1, stick: 3, a: 4, b: 5 };
    const tmpM = new THREE.Matrix4(), tmpM2 = new THREE.Matrix4();
    const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpV3 = new THREE.Vector3();
    const tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3();
    const FWD = new THREE.Vector3(0, 0, -1), XAXIS = new THREE.Vector3(1, 0, 0);

    const handPoint = (h, out) => out.setFromMatrixPosition(tmpM.multiplyMatrices(h.ray.matrixWorld, HOLD_OFFSET));
    function readInputs() {
      for (const h of hands) {
        h.prev = h.btn;
        h.btn = {};
        const gp = h.src && h.src.gamepad;
        for (const [k, idx] of Object.entries(BTN)) h.btn[k] = !!(gp && gp.buttons[idx] && gp.buttons[idx].pressed);
        h.stickY = gp && gp.axes.length > 3 ? gp.axes[3] : 0;
        // Handposition + Geschwindigkeit (für Würfe)
        handPoint(h, h.point);
        h.hist.push({ p: h.point.clone(), t: elapsed });
        while (h.hist.length > 2 && elapsed - h.hist[0].t > 0.1) h.hist.shift();
        const a = h.hist[0], b = h.hist[h.hist.length - 1];
        if (b.t - a.t > 0.001) h.vel.copy(b.p).sub(a.p).divideScalar(b.t - a.t);
      }
    }
    const down = (h, k) => h.btn[k] && !h.prev[k];
    const up = (h, k) => !h.btn[k] && h.prev[k];
    const btnName = (h, k) => k === 'a' ? (h.handedness === 'left' ? 'X' : 'A') : (h.handedness === 'left' ? 'Y' : 'B');

    function pulse(h, intensity, ms) {
      const act = h && h.src && h.src.gamepad && h.src.gamepad.hapticActuators && h.src.gamepad.hapticActuators[0];
      if (act && act.pulse) act.pulse(intensity, ms);
    }
    function clearHand(h) {
      if (h.item) { h.ray.remove(h.item.obj); h.item = null; }
      if (h.knife) { h.ray.remove(h.knife.obj); h.knife = null; }
      h.grab = null;
    }
    // Hand lässt los (Griff-Taste losgelassen)
    function releaseHand(h) {
      if (h.grab) {
        if (h.grab.back && W) actionForward(); // Federkraft schiebt nach vorne
        h.grab = null;
      }
      if (h.item) {
        const obj = h.item.obj;
        obj.updateWorldMatrix(true, false);
        obj.matrixWorld.decompose(obj.position, obj.quaternion, tmpS);
        h.ray.remove(obj);
        addDebris(obj, h.vel.clone(), 4, false);
        h.item = null;
      }
      if (h.knife) throwKnife(h);
    }

    // =========================================================================
    // Waffe in der Hand: Zustand & Mechanik
    // =========================================================================
    let W = null;               // Waffe, die gerade gehalten wird
    const looseWeapons = [];    // abgelegte Waffen
    const mode = () => W.def.modes[W.modeIdx];
    const offHand = () => (W && W.hand >= 0 ? hands[1 - W.hand] : null);

    function equip(id, handIndex) {
      const inst = buildWeapon(id);
      const def = inst.def;
      Object.assign(inst, {
        id, hand: handIndex,
        chamber: 'live', magInserted: def.feed === 'mag', magRounds: def.capacity, tube: def.feed === 'tube' ? def.capacity : 0,
        actionOpen: false, modeIdx: def.startMode, cooldown: 0, recoil: 0, cycleAnim: 0, travel: 0,
        twoHanding: false, zoom: 6, desktopBusy: false, aim: 0, aligned: false
      });
      takeWeapon(inst, handIndex);
    }
    function takeWeapon(inst, handIndex) {
      if (W) {
        if (renderer.xr.isPresenting && W.hand >= 0) dropWeapon(hands[W.hand]);
        else if (W.root.parent) W.root.parent.remove(W.root);
      }
      for (const h of hands) h.grab = null;
      W = inst;
      W.hand = handIndex;
      W.twoHanding = false;
      W.handTravel = false;
      if (renderer.xr.isPresenting) scene.add(W.root);
      else { camera.add(W.root); W.root.quaternion.identity(); }
      setBeltWeapon(W.id);
      SFX.grab();
      boardDirty = true;
    }
    function dropWeapon(h) {
      const off = offHand();
      if (off && off.grab) { if (off.grab.back) actionForward(); off.grab = null; }
      W.twoHanding = false; W.handTravel = false; W.recoil = 0; W.cycleAnim = 0;
      W.parts.flash.visible = false;
      W.parts.flashLight.intensity = 0;
      W.body.position.set(0, 0, 0);
      W.body.rotation.set(0, 0, 0);
      W.hand = -1;
      const vel = h.vel.clone();
      // Langsam losgelassen: bleibt in der Luft schweben (zum Umgreifen); geworfen: fällt
      const hover = vel.length() < 0.8;
      looseWeapons.push({ inst: W, vel: hover ? new THREE.Vector3() : vel, hover, resting: false, box: new THREE.Box3(),
        spin: new THREE.Vector3().randomDirection().multiplyScalar(hover ? 0 : 3), t: 0, baseY: W.root.position.y });
      if (looseWeapons.length > 4) { const old = looseWeapons.shift(); scene.remove(old.inst.root); }
      W = null;
      SFX.grab();
      pulse(h, 0.3, 30);
      boardDirty = true;
    }
    function pickUp(lw, handIndex) {
      looseWeapons.splice(looseWeapons.indexOf(lw), 1);
      takeWeapon(lw.inst, handIndex);
    }
    function updateLoose(dt) {
      for (const lw of looseWeapons) {
        const r = lw.inst.root;
        lw.t += dt;
        if (lw.hover) {
          r.position.y = lw.baseY + Math.sin(lw.t * 2) * 0.005;
        } else if (!lw.resting) {
          lw.vel.y -= 9.81 * dt;
          r.position.addScaledVector(lw.vel, dt);
          r.rotation.x += lw.spin.x * dt;
          r.rotation.z += lw.spin.z * dt;
          if (r.position.y < 0.03) {
            r.position.y = 0.03;
            lw.resting = true;
            const f = tmpV.set(0, 0, -1).applyQuaternion(r.quaternion);
            r.quaternion.setFromEuler(new THREE.Euler(0, Math.atan2(-f.x, -f.z), Math.PI / 2, 'YXZ'));
            SFX.click(500, 0.5, 0.1);
          }
        } else continue;
        r.updateMatrixWorld(true);
        lw.box.setFromObject(r);
      }
    }

    function ejectObject(obj, speed = 1.6) {
      // Hülse/Patrone fliegt rechts aus dem Auswurffenster
      W.sockets.eject.getWorldPosition(tmpV);
      W.root.getWorldQuaternion(tmpQ);
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(tmpQ);
      const upv = new THREE.Vector3(0, 1, 0).applyQuaternion(tmpQ);
      const back = new THREE.Vector3(0, 0, 1).applyQuaternion(tmpQ);
      obj.position.copy(tmpV);
      obj.quaternion.copy(tmpQ);
      const vel = right.multiplyScalar(speed * THREE.MathUtils.randFloat(0.8, 1.2))
        .addScaledVector(upv, speed * 0.7).addScaledVector(back, speed * 0.3 * Math.random());
      addDebris(obj, vel, 3, true);
    }
    function ejectChamber() {
      if (W.chamber === 'empty') return;
      const spent = W.chamber === 'spent';
      let obj;
      if (W.def.feed === 'tube') obj = makeShell(spent);
      else if (spent) obj = makeCasing(W.id === 'sniper');
      else obj = makeCartridge(W.id === 'sniper');
      ejectObject(obj, W.def.autoCycle ? 1.8 : 1.1);
      W.chamber = 'empty';
    }
    function feed() {
      if (W.def.feed === 'mag' && W.magInserted && W.magRounds > 0) { W.magRounds--; W.chamber = 'live'; return true; }
      if (W.def.feed === 'tube' && W.tube > 0) { W.tube--; W.chamber = 'live'; return true; }
      return false;
    }
    function actionBack() {
      ejectChamber();
      W.actionOpen = true;
      SFX.rackBack();
      boardDirty = true;
    }
    function actionForward() {
      const fed = feed();
      // Leeres Magazin: Schlitten/Verschluss bleibt hinten (Verschlussfang)
      W.actionOpen = !fed && W.def.holdOpen && W.magInserted && W.magRounds === 0;
      SFX.rackFwd();
      boardDirty = true;
    }
    function ejectMag() {
      if (W.def.feed !== 'mag' || !W.magInserted) return;
      W.magInserted = false;
      const mag = W.parts.mag;
      mag.updateWorldMatrix(true, false);
      const drop = BUILDERS[W.id + 'Mag']();
      mag.matrixWorld.decompose(drop.position, drop.quaternion, tmpS);
      W.root.getWorldQuaternion(tmpQ);
      addDebris(drop, new THREE.Vector3(0, -1.2, 0).applyQuaternion(tmpQ), 5, false);
      mag.visible = false;
      SFX.magOut();
      boardDirty = true;
    }
    function insertMag() {
      W.magInserted = true;
      W.magRounds = W.def.capacity;
      W.parts.mag.visible = true;
      SFX.magIn();
      boardDirty = true;
    }
    function toggleMode() {
      if (W.def.modes.length < 2) return false;
      W.modeIdx = (W.modeIdx + 1) % W.def.modes.length;
      SFX.selector();
      boardDirty = true;
      return true;
    }

    // ---- Treffer werten (Schuss und Messer) --------------------------------
    function scoreTargetHit(target, ring, point, mult, prefix = '') {
      let pts = RING_POINTS[ring];
      if (target.userData.motion) pts += 2;
      if (state === 'playing') {
        hits++;
        if (ring === 0) bullseyes++;
        const gained = Math.round(pts * combo * mult);
        score += gained;
        floatingText(`${prefix}+${gained}${combo > 1 ? ` (x${combo})` : ''}`, point, ring === 0 ? '#ffd21f' : '#ffffff');
        combo = Math.min(5, combo + 1);
      }
      SFX.hit(RING_POINTS[ring]);
      burst(point, ring === 0 ? 0xffd21f : 0xff4433, ring === 0 ? 30 : 16);
      explodeTarget(target);
      boardDirty = true;
    }
    const ringOf = (face, point) => {
      const local = face.worldToLocal(point.clone());
      return { local, ring: Math.floor(Math.min(0.999, Math.hypot(local.x, local.y) / TARGET_RADIUS) * RING_POINTS.length) };
    };

    // ---- Schießen ----------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    function tryFire(desktopRay) {
      if (mode() === 'safe' || W.actionOpen || W.chamber !== 'live') {
        SFX.dry();
        pulse(hands[W.hand], 0.15, 20);
        return false;
      }
      W.chamber = 'spent';
      W.cooldown = 60 / W.def.rpm;
      W.recoil = 1;
      W.recoilSide = THREE.MathUtils.randFloatSpread(1);
      SFX.shot(W.def);
      if (W.hand >= 0) { pulse(hands[W.hand], 1.0, 80); if (W.twoHanding) pulse(offHand(), 0.6, 60); }

      // Schusslinie entlang der Visierlinie (Waffe ist "eingeschossen")
      const origin = new THREE.Vector3(), dir = new THREE.Vector3();
      if (desktopRay) { origin.copy(desktopRay.origin); dir.copy(desktopRay.direction); }
      else {
        W.sockets.sightRear.getWorldPosition(origin);
        W.sockets.sightFront.getWorldPosition(dir).sub(origin).normalize();
      }
      let spread = W.def.spread;
      if (W.def.twoHand && !W.twoHanding && W.hand >= 0) spread += 0.012; // einhändig unruhiger
      const muzzlePos = W.sockets.muzzle.getWorldPosition(new THREE.Vector3());
      const candidates = startButton.visible ? [...hitMeshes, ...startButton.userData.hit] : hitMeshes;

      const hitsByTarget = new Map();
      let startHit = null;
      for (let p = 0; p < W.def.pellets; p++) {
        const d = dir.clone();
        if (spread > 0) d.add(new THREE.Vector3().randomDirection().multiplyScalar(spread * Math.sqrt(Math.random()))).normalize();
        raycaster.set(origin, d);
        raycaster.far = 200;
        const hit = raycaster.intersectObjects(candidates, false)[0];
        const end = hit ? hit.point : origin.clone().addScaledVector(d, 60);
        if (p < 3) spawnTracer(muzzlePos, end);
        if (!hit) continue;
        if (hit.object.userData.isStart) { startHit = hit; continue; }
        const target = hit.object.userData.target;
        if (!target || target.userData.dying) continue;
        const { local, ring } = ringOf(hit.object, hit.point);
        bulletHole(hit.object, local);
        const prev = hitsByTarget.get(target);
        if (!prev || ring < prev.ring) hitsByTarget.set(target, { ring, point: hit.point.clone() });
      }

      // Auswerfen & Nachführen bei Halbautomaten
      if (W.def.autoCycle) {
        ejectChamber();
        if (!feed()) W.actionOpen = W.def.holdOpen;
        W.cycleAnim = 1;
      }
      if (state === 'playing') shots++;
      boardDirty = true;

      if (startHit) {
        burst(startHit.point, 0x33ff77, 20);
        if (state !== 'playing') startRound();
        return true;
      }
      if (state === 'playing' && hitsByTarget.size === 0) combo = 1;
      for (const [target, h] of hitsByTarget) scoreTargetHit(target, h.ring, h.point, W.def.scoreMult);
      return true;
    }

    // ---- Hände: greifen, loslassen, zeigen (VR) ----------------------------
    function tryOffhandGrab(h, p) {
      if (!W || W.hand < 0 || W.hand === h.i) return false;
      const opts = [];
      if (W.def.action !== 'pump') opts.push({ type: 'charger', d: p.distanceTo(W.sockets.chargerGrab.getWorldPosition(tmpV)) / 0.07 });
      if (W.sockets.foregrip) opts.push({ type: 'fore', d: p.distanceTo(W.sockets.foregrip.getWorldPosition(tmpV)) / 0.13 });
      opts.push({ type: 'swap', d: p.distanceTo(W.root.getWorldPosition(tmpV)) / 0.06 });
      opts.sort((a, b) => a.d - b.d);
      const o = opts[0];
      if (o.d > 1) return false;
      if (o.type === 'swap') {
        // Waffe in die andere Hand übergeben
        W.hand = h.i;
        h.consumedTrigger = h.btn.trigger;
        SFX.grab();
        pulse(h, 0.5, 40);
        boardDirty = true;
        return true;
      }
      h.grab = { type: o.type, startZ: W.root.worldToLocal(p.clone()).z, back: false };
      SFX.grab();
      pulse(h, 0.4, 30);
      return true;
    }

    function updateHandsXR() {
      for (const it of rackItems) it.hover = false;
      for (const h of hands) {
        if (!h.src) { h.pointer.visible = false; continue; }
        const p = h.point;
        const holdsWeapon = W && W.hand === h.i;
        const busy = holdsWeapon || h.item || h.knife || h.grab;

        // Zeigestrahl auf Waffenwand oder abgelegte Waffen
        let pointed = null, pointDist = 3;
        if (!busy && (rack.visible || looseWeapons.length)) {
          h.ray.getWorldPosition(tmpV);
          h.ray.getWorldQuaternion(tmpQ);
          raycaster.set(tmpV, tmpV3.set(0, 0, -1).applyQuaternion(tmpQ));
          const test = (box, obj) => {
            const hit = raycaster.ray.intersectBox(box, tmpV2);
            if (hit) { const d = hit.distanceTo(tmpV); if (d < pointDist) { pointDist = d; pointed = obj; } }
          };
          if (rack.visible) for (const it of rackItems) test(it.box, { rack: it });
          for (const lw of looseWeapons) test(lw.box, { loose: lw });
          h.pointer.visible = true;
          h.pointer.scale.z = pointDist;
        } else h.pointer.visible = false;

        const nearRack = rack.visible ? rackItems.find(it => it.box.distanceToPoint(p) < 0.04) : null;
        const nearLoose = looseWeapons.find(lw => lw.box.distanceToPoint(p) < 0.05);
        if (nearRack) nearRack.hover = true;
        if (pointed && pointed.rack) pointed.rack.hover = true;

        if (down(h, 'squeeze') && !busy) {
          if (tryOffhandGrab(h, p)) { /* Waffe mit 2. Hand gegriffen */ }
          else if (tryBeltGrab(h, p)) { /* vom Gürtel genommen */ }
          else if (nearLoose) pickUp(nearLoose, h.i);
          else if (nearRack) equip(nearRack.id, h.i);
          else if (pointed) pointed.rack ? equip(pointed.rack.id, h.i) : pickUp(pointed.loose, h.i);
        }
        if (down(h, 'trigger') && !busy && pointed) {
          pointed.rack ? equip(pointed.rack.id, h.i) : pickUp(pointed.loose, h.i);
          h.consumedTrigger = true;
          pulse(h, 0.6, 50);
        }
        if (holdsWeapon && down(h, 'stick')) { dropWeapon(h); continue; }
        if (up(h, 'squeeze')) releaseHand(h);
      }
      if (rack.visible) for (const it of rackItems) {
        drawRackLabel(it, W && W.id === it.id, it.hover);
        it.holder.scale.setScalar(it.hover ? 1.06 : 1);
      }
    }

    // ---- Waffen-Logik pro Frame (VR) ---------------------------------------
    function updateWeaponXR(dt) {
      const main = hands[W.hand];
      const off = hands[1 - W.hand];
      const offPos = off.point;
      W.twoHanding = !!(off.src && off.grab && off.grab.type === 'fore');

      // --- Pose berechnen
      tmpM.multiplyMatrices(main.ray.matrixWorld, HOLD_OFFSET);
      tmpM.decompose(W.root.position, W.root.quaternion, tmpS);
      if (W.twoHanding) {
        const upv = new THREE.Vector3(0, 1, 0).applyQuaternion(W.root.quaternion);
        tmpM2.lookAt(W.root.position, offPos, upv);
        W.root.quaternion.setFromRotationMatrix(tmpM2).multiply(W.foreQ);
      }
      W.root.updateMatrixWorld(true);

      // --- Verschluss / Schlitten / Pumpe mit der Hand bewegen
      if (off.grab && (off.grab.type === 'charger' || (off.grab.type === 'fore' && W.def.action === 'pump'))) {
        const local = W.root.worldToLocal(offPos.clone());
        const g = off.grab;
        W.travel = THREE.MathUtils.clamp(local.z - g.startZ, 0, W.def.travel);
        if (!g.back && W.travel > W.def.travel * 0.85) { g.back = true; actionBack(); pulse(off, 0.5, 40); }
        if (g.back && W.travel < W.def.travel * 0.15) { g.back = false; actionForward(); pulse(off, 0.6, 40); }
        W.handTravel = true;
      } else W.handTravel = false;

      // --- Magazin / Patrone einführen
      if (off.item) {
        const itemPos = off.item.obj.getWorldPosition(new THREE.Vector3());
        if (off.item.type === 'mag' && !W.magInserted && itemPos.distanceTo(W.sockets.magwell.getWorldPosition(tmpV)) < 0.07) {
          off.ray.remove(off.item.obj);
          off.item = null;
          insertMag();
          pulse(off, 0.8, 50); pulse(main, 0.5, 40);
        } else if (off.item.type === 'tube' && W.tube < W.def.capacity && itemPos.distanceTo(W.sockets.loadPort.getWorldPosition(tmpV)) < 0.08) {
          off.ray.remove(off.item.obj);
          off.item = null;
          W.tube++;
          SFX.shellIn();
          pulse(off, 0.5, 30);
          boardDirty = true;
        }
      }

      // --- Tasten an der Waffenhand
      if (down(main, 'a')) ejectMag();
      if (down(main, 'b')) {
        if (!toggleMode() && W.actionOpen) actionForward(); // Pistole: Schlittenfang lösen
        pulse(main, 0.2, 20);
      }
      if (W.def.sight === 'scope' && Math.abs(main.stickY) > 0.3) {
        W.zoom = THREE.MathUtils.clamp(W.zoom - main.stickY * dt * 8, 4, 12);
      }

      // --- Abzug
      if (main.consumedTrigger) { if (!main.btn.trigger) main.consumedTrigger = false; return; }
      if (down(main, 'trigger')) { if (W.cooldown <= 0) tryFire(); }
      else if (main.btn.trigger && mode() === 'auto' && W.cooldown <= 0 && W.chamber === 'live') tryFire();
    }

    // =========================================================================
    // Gürtel mit Munition und Messer
    // =========================================================================
    const belt = new THREE.Group();
    scene.add(belt);
    const BELT_R = 0.17;
    const beltSlots = [];
    let beltWeaponId = null, beltYaw = 0;
    const leather = new THREE.MeshStandardMaterial({ color: 0x4a2f1c, roughness: 0.75, side: THREE.DoubleSide });
    const pouchMat = new THREE.MeshStandardMaterial({ color: 0x3c4130, roughness: 0.95 });
    {
      belt.add(new THREE.Mesh(new THREE.CylinderGeometry(BELT_R, BELT_R, 0.045, 48, 1, true), leather));
      const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.052, 0.01), MAT.bright);
      buckle.position.set(0, 0, -BELT_R - 0.004);
      belt.add(buckle);
      const inner = new THREE.Mesh(new THREE.BoxGeometry(0.044, 0.036, 0.012), leather);
      inner.position.set(0, 0, -BELT_R - 0.006);
      belt.add(inner);
    }
    function beltMount(phi) {
      const g = new THREE.Group();
      g.position.set(Math.sin(phi) * BELT_R, 0, -Math.cos(phi) * BELT_R);
      g.rotation.y = -phi;
      belt.add(g);
      return g;
    }
    // Messerscheide
    const knifeSlot = (() => {
      const mount = beltMount(-1.3);
      const sheath = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.14, 0.036), leather);
      sheath.position.set(0, -0.075, -0.02);
      mount.add(sheath);
      const knife = makeKnife();
      knife.rotation.x = -Math.PI / 2;
      knife.position.set(0, 0.055, -0.02);
      mount.add(knife);
      const slot = { kind: 'knife', mount, obj: knife, available: true, refill: 0, radius: 0.1 };
      beltSlots.push(slot);
      return slot;
    })();
    function setBeltWeapon(id) {
      if (id === beltWeaponId) return;
      beltWeaponId = id;
      for (let i = beltSlots.length - 1; i >= 0; i--) {
        if (beltSlots[i].kind === 'knife') continue;
        belt.remove(beltSlots[i].mount);
        beltSlots.splice(i, 1);
      }
      const def = WEAPON_DEFS[id];
      for (const side of [-1, 1]) {
        const mount = beltMount(side * 0.55);
        if (def.feed === 'mag') {
          const pouch = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.075, 0.042), pouchMat);
          pouch.position.set(0, -0.022, -0.024);
          mount.add(pouch);
          const mag = BUILDERS[id + 'Mag']();
          mag.position.set(0, 0.035, -0.024);
          mount.add(mag);
          beltSlots.push({ kind: 'mag', mount, obj: mag, available: true, refill: 0, radius: 0.09 });
        } else {
          const strip = new THREE.Mesh(new THREE.BoxGeometry(0.105, 0.032, 0.008), leather);
          strip.position.set(0, 0, -0.014);
          mount.add(strip);
          for (let k = 0; k < 4; k++) {
            const sh = makeShell();
            sh.position.set(-0.036 + k * 0.024, 0.008, -0.027);
            mount.add(sh);
            beltSlots.push({ kind: 'shell', mount, obj: sh, available: true, refill: 0, radius: 0.045 });
          }
        }
      }
    }
    const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
    function updateBelt(dt) {
      const view = getViewCamera();
      view.getWorldQuaternion(tmpQ);
      // Hüfte sitzt unter dem Hals, nicht unter den Augen (beim Runterschauen bleibt der Gürtel stehen)
      const neck = tmpV.set(0, -0.08, 0.1).applyQuaternion(tmpQ).add(headPos);
      belt.position.set(neck.x, neck.y - 0.5, neck.z);
      const f = tmpV2.set(0, 0, -1).applyQuaternion(tmpQ);
      if (Math.abs(f.y) < 0.85) {
        const diff = wrapAngle(Math.atan2(-f.x, -f.z) - beltYaw);
        if (Math.abs(diff) > 0.45) beltYaw += diff - Math.sign(diff) * 0.45;
        beltYaw += diff * Math.min(1, dt * 0.7);
      }
      belt.rotation.y = beltYaw;
      // Messer auf der Seite der freien Hand
      const side = W && W.hand >= 0 && hands[W.hand].handedness === 'left' ? 1 : -1;
      const phi = side * 1.3;
      knifeSlot.mount.position.set(Math.sin(phi) * BELT_R, 0, -Math.cos(phi) * BELT_R);
      knifeSlot.mount.rotation.y = -phi;
      for (const s of beltSlots) {
        if (s.available) continue;
        s.refill -= dt;
        if (s.refill <= 0) { s.available = true; s.obj.visible = true; }
      }
      belt.updateMatrixWorld(true);
    }
    function tryBeltGrab(h, p) {
      let best = null, bd = Infinity;
      const offHandOfWeapon = W && W.hand >= 0 && W.hand !== h.i;
      for (const s of beltSlots) {
        if (!s.available) continue;
        if (s.kind !== 'knife' && !offHandOfWeapon) continue; // Munition nur mit der freien Hand
        const d = s.obj.getWorldPosition(tmpV).distanceTo(p);
        if (d < s.radius && d < bd) { bd = d; best = s; }
      }
      if (!best) return false;
      best.available = false;
      best.obj.visible = false;
      best.refill = best.kind === 'knife' ? 2 : 1.2;
      if (best.kind === 'knife') {
        const k = makeKnife();
        k.position.set(0, -0.045, 0.015);
        h.ray.add(k);
        h.knife = { obj: k };
      } else {
        const obj = best.kind === 'mag' ? BUILDERS[W.id + 'Mag']() : makeShell();
        obj.position.set(0, 0.05, -0.03);
        obj.rotation.x = -0.3;
        h.ray.add(obj);
        h.item = { type: best.kind === 'mag' ? 'mag' : 'tube', obj };
      }
      SFX.grab();
      pulse(h, 0.5, 40);
      return true;
    }

    // =========================================================================
    // Wurfmesser
    // =========================================================================
    function makeKnife() {
      const g = new THREE.Group();
      g.add(prof([[-0.055, -0.011], [0.035, -0.012], [0.035, 0.012], [-0.055, 0.011], [-0.062, 0]], 0.022, MAT.grip, 0.004));
      g.add(box(0.026, 0.036, 0.006, MAT.steel, 0.038, 0));
      g.add(prof([[0.04, 0.011], [0.13, 0.011], [0.175, 0.0], [0.16, -0.008], [0.04, -0.011]], 0.004, MAT.bright, 0.001));
      g.add(box(0.024, 0.022, 0.008, MAT.steel, -0.064, 0));
      return g;
    }
    const knives = [];
    function throwKnife(h) {
      const k = h.knife.obj;
      h.knife = null;
      k.updateWorldMatrix(true, false);
      k.matrixWorld.decompose(k.position, k.quaternion, tmpS);
      h.ray.remove(k);
      scene.add(k);
      const v = h.vel.clone();
      if (v.length() < 1.5) {
        // Langsam losgelassen: zurück in die Scheide oder fallen lassen
        if (k.position.distanceTo(knifeSlot.obj.getWorldPosition(tmpV)) < 0.15) {
          scene.remove(k);
          knifeSlot.available = true;
          knifeSlot.obj.visible = true;
          SFX.click(900, 0.3, 0.05);
          return;
        }
        knives.push({ obj: k, vel: v, flying: true, spin: 0, spinRate: 3, life: 6 });
        return;
      }
      launchKnife(k, aimAssist(k.position, v.multiplyScalar(1.5)));
    }
    function launchKnife(k, vel) {
      if (state === 'playing') { shots++; boardDirty = true; }
      knives.push({ obj: k, vel, flying: true, spin: 0, spinRate: 14, life: 8 });
      if (audioCtx) noise(audioCtx.currentTime, 0.25, 0.25, 'bandpass', 700, 2200, 2);
      while (knives.length > 10) { const old = knives.shift(); if (old.obj.parent) old.obj.parent.remove(old.obj); }
    }
    // Wurfhilfe: Liegt eine Scheibe ungefähr in Wurfrichtung, wird die Flugbahn passend berechnet
    function aimAssist(pos, vel) {
      const flat = new THREE.Vector3(vel.x, 0, vel.z);
      if (flat.lengthSq() < 1e-4) return vel;
      flat.normalize();
      const cands = targets.filter(t => !t.userData.dying).map(t => t.position);
      if (startButton.visible) cands.push(startButton.getWorldPosition(new THREE.Vector3()));
      let best = null, bestAng = 0.26;
      for (const c of cands) {
        const to = c.clone().sub(pos);
        const d = Math.hypot(to.x, to.z);
        if (d < 0.5 || d > 14) continue;
        const ang = flat.angleTo(new THREE.Vector3(to.x, 0, to.z).normalize());
        if (ang < bestAng) { bestAng = ang; best = c; }
      }
      if (!best) return vel;
      const to = best.clone().sub(pos);
      const d = Math.hypot(to.x, to.z), hgt = to.y, g = 9.81;
      const v = THREE.MathUtils.clamp(vel.length(), 7, 15);
      const disc = v ** 4 - g * (g * d * d + 2 * hgt * v * v);
      if (disc < 0) return vel;
      const theta = Math.atan((v * v - Math.sqrt(disc)) / (g * d));
      return new THREE.Vector3(to.x, 0, to.z).normalize().multiplyScalar(v * Math.cos(theta)).add(new THREE.Vector3(0, v * Math.sin(theta), 0));
    }
    function updateKnives(dt) {
      for (let i = knives.length - 1; i >= 0; i--) {
        const k = knives[i];
        k.life -= dt;
        if (k.life <= 0) { if (k.obj.parent) k.obj.parent.remove(k.obj); knives.splice(i, 1); continue; }
        if (!k.flying) continue;
        k.vel.y -= 9.81 * dt;
        const step = k.vel.clone().multiplyScalar(dt);
        const len = step.length();
        const dir = step.clone().normalize();
        raycaster.set(k.obj.position, dir);
        raycaster.far = len + 0.15;
        const cands = startButton.visible ? [...hitMeshes, ...startButton.userData.hit] : hitMeshes;
        const hit = raycaster.intersectObjects(cands, false)[0];
        if (hit) { stickKnife(k, hit, dir); continue; }
        k.obj.position.add(step);
        k.spin += k.spinRate * dt;
        k.obj.quaternion.setFromUnitVectors(FWD, dir).multiply(tmpQ.setFromAxisAngle(XAXIS, -k.spin));
        if (k.obj.position.y < 0.02) {
          k.flying = false;
          k.life = 4;
          k.obj.position.y = 0.012;
          k.obj.quaternion.setFromEuler(new THREE.Euler(0, Math.random() * 6.28, Math.PI / 2, 'YXZ'));
          SFX.click(2200, 0.3, 0.06);
        }
      }
    }
    function stickKnife(k, hit, dir) {
      k.flying = false;
      k.life = 3;
      k.obj.quaternion.setFromUnitVectors(FWD, dir);
      k.obj.position.copy(hit.point).addScaledVector(dir, -0.14);
      hit.object.attach(k.obj);
      if (audioCtx) { const t = audioCtx.currentTime; noise(t, 0.08, 0.7, 'lowpass', 900, 200); tone(t, 180, 90, 0.1, 0.4); }
      if (hit.object.userData.isStart) {
        burst(hit.point, 0x33ff77, 20);
        if (state !== 'playing') startRound();
        return;
      }
      const target = hit.object.userData.target;
      if (!target || target.userData.dying) return;
      const { ring } = ringOf(hit.object, hit.point);
      scoreTargetHit(target, ring, hit.point, 2, '🔪 ');
    }

    // ---- Desktop: automatisierte Abläufe ------------------------------------
    const timers = [];
    const later = (sec, fn) => timers.push({ t: sec, fn });
    function desktopReload() {
      if (!W || W.desktopBusy) return;
      W.desktopBusy = true;
      let t = 0;
      if (W.def.feed === 'mag') {
        if (W.magInserted) { ejectMag(); t += 0.5; }
        later(t, insertMag);
        t += 0.35;
      } else {
        const need = W.def.capacity - W.tube;
        for (let i = 0; i < need; i++) later(t + i * 0.3, () => { W.tube++; SFX.shellIn(); boardDirty = true; });
        t += need * 0.3 + 0.1;
      }
      later(t, () => {
        if (W.chamber !== 'live') { actionBack(); later(0.18, () => { actionForward(); W.desktopBusy = false; }); }
        else W.desktopBusy = false;
      });
    }
    function desktopAfterShot() {
      if (W.def.autoCycle) return;
      W.desktopBusy = true;
      later(0.3, () => { actionBack(); later(0.18, () => { actionForward(); W.desktopBusy = false; }); });
    }

    function updateWeaponVisuals(dt) {
      const u = W;
      u.cooldown -= dt;
      u.recoil = Math.max(0, u.recoil - dt * (u.def.autoCycle ? 9 : 5));
      const k = u.recoil * u.recoil;
      u.body.position.z = k * u.def.recoil.back;
      u.body.rotation.x = k * u.def.recoil.rise;
      u.body.rotation.y = k * u.def.recoil.jitter * (u.recoilSide || 0);
      u.parts.flash.visible = u.recoil > 0.7;
      u.parts.flash.rotation.z = Math.random() * Math.PI;
      u.parts.flash.scale.setScalar(u.def.pellets > 1 ? 1.6 : u.id === 'sniper' ? 1.4 : 1);
      u.parts.flashLight.intensity = u.recoil > 0.7 ? 4 : 0;
      // Verschluss-Stellung
      u.cycleAnim = Math.max(0, u.cycleAnim - dt * 14);
      let travel;
      if (u.handTravel) travel = u.travel;
      else if (u.cycleAnim > 0) travel = Math.sin((1 - u.cycleAnim) * Math.PI) * u.def.travel;
      else travel = u.actionOpen ? u.def.travel * (u.def.holdOpen ? 0.8 : 1) : 0;
      if (u.cycleAnim > 0 && u.actionOpen && u.cycleAnim < 0.5) travel = u.def.travel * 0.8;
      u.parts.charger.position.z = travel;
      if (u.parts.selector) u.parts.selector.rotation.x = [-0.9, 0, 0.9][u.modeIdx];
    }

    // =========================================================================
    // Zielscheiben
    // =========================================================================
    const targetTexture = (() => {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const colors = ['#ffd21f', '#e0261b', '#ffffff', '#e0261b', '#ffffff'];
      for (let i = RING_POINTS.length - 1; i >= 0; i--) {
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, (size / 2) * (i + 1) / RING_POINTS.length, 0, Math.PI * 2);
        ctx.fillStyle = colors[i];
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#222';
        ctx.stroke();
      }
      ctx.font = 'bold 34px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 1; i < RING_POINTS.length; i++) {
        const r = (size / 2) * (i + 0.5) / RING_POINTS.length;
        ctx.fillStyle = colors[i] === '#ffffff' ? '#222' : '#fff';
        ctx.fillText(RING_POINTS[i], size / 2, size / 2 - r);
      }
      const t = new THREE.CanvasTexture(canvas);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();
    const targetFaceGeo = new THREE.CircleGeometry(TARGET_RADIUS, 48);
    const targetFaceMat = new THREE.MeshStandardMaterial({ map: targetTexture, roughness: 0.8 });

    function createTarget(position, scale, motion) {
      const group = new THREE.Group();
      const rim = new THREE.Mesh(targetRimGeo, targetRimMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.z = -0.016;
      group.add(rim);
      const face = new THREE.Mesh(targetFaceGeo, targetFaceMat);
      face.userData.target = group;
      group.add(face);
      group.position.copy(position);
      group.scale.setScalar(0.01);
      group.userData = { face, base: position.clone(), scale, motion, age: 0, dying: false, dieTime: 0, spin: 0 };

      scene.add(group);
      targets.push(group);
      hitMeshes.push(face);

    function removeTarget(group) {
      scene.remove(group);

    function explodeTarget(target) {
      if (target.userData.dying) return;
      target.userData.dying = true;

      target.userData.spin = (Math.random() < 0.5 ? -1 : 1) * THREE.MathUtils.randFloat(6, 10);

    // Spieler-Bezugssystem

    function updatePlayerFrame() {
      camera.updateMatrixWorld(true);
      const cam = getViewCamera();
      cam.getWorldPosition(playerHead);
      const dir = new THREE.Vector3();
      cam.getWorldDirection(dir);
      dir.y = 0;
      if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1);
      dir.normalize();
      playerYaw = Math.atan2(-dir.x, -dir.z);
    }
    function pointInFront(dist, angle, height) {
      const a = playerYaw + angle;
      return new THREE.Vector3(playerHead.x - Math.sin(a) * dist, height, playerHead.z - Math.cos(a) * dist);
    }
    function spawnTarget() {
      const difficulty = Math.min(1, (ROUND_TIME - timeLeft) / ROUND_TIME);
      const [rMin, rMax] = W ? W.def.range : [2.5, 6];
      let pos;
      for (let tries = 0; tries < 20; tries++) {
        const angle = THREE.MathUtils.randFloatSpread(THREE.MathUtils.degToRad(rMax > 10 ? 60 : 100));
        const dist = THREE.MathUtils.randFloat(rMin, THREE.MathUtils.lerp(rMin + (rMax - rMin) * 0.5, rMax, difficulty));
        const height = Math.max(0.5, playerHead.y + THREE.MathUtils.randFloat(-0.6, rMax > 10 ? 1.2 : 0.6));
        pos = pointInFront(dist, angle, height);
        if (targets.every(t => t.position.distanceTo(pos) > 0.8)) break;
      }
      const scale = THREE.MathUtils.lerp(1.1, 0.65, difficulty) * THREE.MathUtils.randFloat(0.9, 1.1);
      const moving = Math.random() < 0.15 + difficulty * 0.6;
      const motion = moving ? {
        ampX: THREE.MathUtils.randFloat(0.4, 1.2),
        ampY: Math.random() < 0.4 ? THREE.MathUtils.randFloat(0.1, 0.35) : 0,
        speed: THREE.MathUtils.randFloat(0.6, 1.0 + difficulty * 1.3),
        phase: Math.random() * Math.PI * 2
      } : null;
      createTarget(pos, scale, motion);
