<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Passthrough Schießstand</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #info {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      color: #fff; text-align: center; background: rgba(0,0,0,.55);
      padding: 10px 16px; border-radius: 10px; font-size: 14px; line-height: 1.4;
      max-width: 90vw; pointer-events: none;
    }
    #info b { color: #ffd34d; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <b>Passthrough Schießstand</b> – Quest 3: „START AR“ drücken.<br />
    Abzug = schießen · Griff-Taste = nachladen · Am PC: Klick = schießen, R = nachladen
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    // ---------------------------------------------------------------------------
    // Einstellungen
    // ---------------------------------------------------------------------------
    const ROUND_TIME = 60;          // Sekunden pro Runde
    const MAG_SIZE = 12;            // Schuss pro Magazin
    const RELOAD_TIME = 0.9;        // Sekunden
    const MAX_TARGETS = 3;          // gleichzeitig sichtbare Zielscheiben
    const TARGET_RADIUS = 0.25;     // Meter
    const RING_POINTS = [10, 8, 6, 4, 2]; // von innen nach außen

    // ---------------------------------------------------------------------------
    // Grundgerüst
    // ---------------------------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0); // transparent -> Passthrough sichtbar
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const desktopBackground = new THREE.Color(0x30343c);
    scene.background = desktopBackground;

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(0, 1.6, 0);
    scene.add(camera);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x666677, 2.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(1, 3, 2);
    scene.add(sun);

    // Boden nur am PC zur Orientierung (im Passthrough siehst du deinen echten Boden)
    const desktopFloor = new THREE.GridHelper(20, 20, 0x666666, 0x444444);
    scene.add(desktopFloor);

    document.body.appendChild(ARButton.createButton(renderer, {
      optionalFeatures: ['local-floor']
    }));

    renderer.xr.addEventListener('sessionstart', () => {
      scene.background = null;
      desktopFloor.visible = false;
      desktopGun.visible = false;
      ensureAudio();
      // Nach dem Start kurz warten, bis die Kopfposition bekannt ist
      setTimeout(placeMenu, 300);
    });
    renderer.xr.addEventListener('sessionend', () => {
      scene.background = desktopBackground;
      desktopFloor.visible = true;
      desktopGun.visible = true;
      camera.position.set(0, 1.6, 0);
      camera.rotation.set(0, 0, 0);
      placeMenu();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------------------------------------------------------------------------
    // Audio (synthetisch, keine Dateien nötig)
    // ---------------------------------------------------------------------------
    let audioCtx = null;
    let noiseBuffer = null;
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
        const d = noiseBuffer.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('pointerdown', ensureAudio);
    document.addEventListener('keydown', ensureAudio);

    function playShot() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(4000, t);
      filter.frequency.exponentialRampToValueAtTime(300, t + 0.25);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.9, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      src.connect(filter).connect(g).connect(audioCtx.destination);
      src.start(t);
      src.stop(t + 0.35);

      const osc = audioCtx.createOscillator();
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
      const og = audioCtx.createGain();
      og.gain.setValueAtTime(0.8, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.connect(og).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
    }

    function playTone(freqs, dur = 0.25, vol = 0.25, type = 'sine') {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = type;
        osc.frequency.value = f;
        const g = audioCtx.createGain();
        const start = t + i * 0.06;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        osc.connect(g).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + dur + 0.05);
      });
    }
    const playHit = (pts) => pts >= 10 ? playTone([880, 1175, 1568], 0.3, 0.3) : playTone([660 + pts * 30], 0.2, 0.25);
    const playEmpty = () => playTone([1800], 0.04, 0.2, 'square');
    const playReload = () => { playTone([300], 0.05, 0.2, 'square'); setTimeout(() => playTone([500], 0.05, 0.2, 'square'), RELOAD_TIME * 800); };

    // ---------------------------------------------------------------------------
    // Text-Panels (Canvas-Texturen)
    // ---------------------------------------------------------------------------
    function makePanel(widthM, heightM, pxPerM = 600) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(widthM * pxPerM);
      canvas.height = Math.round(heightM * pxPerM);
      const ctx = canvas.getContext('2d');
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(widthM, heightM),
        new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false })
      );
      return {
        mesh, canvas, ctx,
        draw(fn) { ctx.clearRect(0, 0, canvas.width, canvas.height); fn(ctx, canvas.width, canvas.height); texture.needsUpdate = true; }
      };
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---------------------------------------------------------------------------
    // Pistole
    // ---------------------------------------------------------------------------
    function buildPistol() {
      const gun = new THREE.Group();
      const dark = new THREE.MeshStandardMaterial({ color: 0x23262b, metalness: 0.6, roughness: 0.4 });
      const grey = new THREE.MeshStandardMaterial({ color: 0x5a6068, metalness: 0.7, roughness: 0.3 });
      const grip = new THREE.MeshStandardMaterial({ color: 0x3b2a1d, roughness: 0.8 });
      const orange = new THREE.MeshStandardMaterial({ color: 0xff7a1a, emissive: 0x552200 });

      const body = new THREE.Group(); // wird beim Rückstoß bewegt
      gun.add(body);

      const slide = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.035, 0.2), grey);
      slide.position.set(0, 0.03, -0.06);
      body.add(slide);

      const frame = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.02, 0.17), dark);
      frame.position.set(0, 0.004, -0.045);
      body.add(frame);

      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.02, 12), dark);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(0, 0.03, -0.165);
      body.add(barrel);

      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.11, 0.045), grip);
      handle.position.set(0, -0.045, 0.015);
      handle.rotation.x = -0.25;
      body.add(handle);

      const guard = new THREE.Mesh(new THREE.TorusGeometry(0.018, 0.003, 6, 16, Math.PI), dark);
      guard.rotation.set(Math.PI, Math.PI / 2, 0);
      guard.position.set(0, -0.006, -0.025);
      body.add(guard);

      const sight = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.008, 0.006), orange);
      sight.position.set(0, 0.051, -0.15);
      body.add(sight);

      // Laser-Visier
      const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]);
      const laser = new THREE.Line(laserGeo, new THREE.LineBasicMaterial({ color: 0xff2020, transparent: true, opacity: 0.45 }));
      laser.position.set(0, 0.03, -0.175);
      laser.scale.z = 10;
      body.add(laser);

      // Mündungsfeuer
      const flash = new THREE.Mesh(
        new THREE.SphereGeometry(0.025, 10, 8),
        new THREE.MeshBasicMaterial({ color: 0xffd060, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      flash.scale.set(1, 1, 2);
      flash.position.set(0, 0.03, -0.2);
      flash.visible = false;
      body.add(flash);

      const flashLight = new THREE.PointLight(0xffaa44, 0, 1.5);
      flashLight.position.copy(flash.position);
      body.add(flashLight);

      // Kleines Display auf der Pistole (Munition / Punkte / Zeit)
      const display = makePanel(0.09, 0.045, 4000);
      display.mesh.position.set(-0.0175, 0.035, -0.04);
      display.mesh.rotation.y = -Math.PI / 2;
      body.add(display.mesh);

      const muzzle = new THREE.Object3D();
      muzzle.position.set(0, 0.03, -0.18);
      body.add(muzzle);

      gun.userData = { body, flash, flashLight, laser, muzzle, display, recoil: 0 };
      return gun;
    }

    function drawGunDisplay(gun) {
      gun.userData.display.draw((ctx, w, h) => {
        roundRect(ctx, 0, 0, w, h, 18);
        ctx.fillStyle = 'rgba(10,14,20,0.85)';
        ctx.fill();
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 30px system-ui, sans-serif';
        ctx.fillStyle = '#9ad';
        ctx.fillText(state === 'playing' ? `⏱ ${Math.ceil(timeLeft)}s` : 'BEREIT', 12, h * 0.22);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'right';
        ctx.fillText(`${score} P`, w - 12, h * 0.22);
        ctx.textAlign = 'left';
        if (reloading) {
          ctx.fillStyle = '#ffcc33';
          ctx.font = 'bold 34px system-ui, sans-serif';
          ctx.fillText('LADE NACH…', 12, h * 0.68);
        } else {
          for (let i = 0; i < MAG_SIZE; i++) {
            ctx.fillStyle = i < ammo ? '#ffcc33' : '#333a44';
            ctx.fillRect(12 + i * ((w - 24) / MAG_SIZE), h * 0.5, (w - 24) / MAG_SIZE - 5, h * 0.38);
          }
        }
      });
    }

    // ---------------------------------------------------------------------------
    // Controller
    // ---------------------------------------------------------------------------
    const gunVR = buildPistol();
    gunVR.visible = false;
    const controllers = [];
    for (let i = 0; i < 2; i++) {
      const c = renderer.xr.getController(i);
      c.userData.index = i;
      c.addEventListener('connected', (e) => {
        c.userData.inputSource = e.data;
        c.userData.handedness = e.data.handedness;
        // Pistole standardmäßig in die rechte Hand
        if (e.data.handedness === 'right' || !gunVR.parent || gunVR.parent === scene) attachGun(c);
      });
      c.addEventListener('disconnected', () => { c.userData.inputSource = null; });
      c.addEventListener('selectstart', () => {
        if (gunVR.parent !== c) { attachGun(c); return; } // Abzug der anderen Hand: Pistole wechselt die Hand
        shoot(c);
      });
      c.addEventListener('squeezestart', () => { if (gunVR.parent === c) reload(); });
      scene.add(c);
      controllers.push(c);
    }

    function attachGun(controller) {
      controller.add(gunVR);
      gunVR.visible = true;
    }

    // Pistole am PC (rechts unten im Bild)
    const desktopGun = buildPistol();
    desktopGun.position.set(0.18, -0.17, -0.38);
    desktopGun.scale.setScalar(1.3);
    desktopGun.userData.laser.visible = false;
    camera.add(desktopGun);

    // ---------------------------------------------------------------------------
    // Zielscheiben
    // ---------------------------------------------------------------------------
    const targetTexture = (() => {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const colors = ['#ffd21f', '#e0261b', '#ffffff', '#e0261b', '#ffffff'];
      for (let i = RING_POINTS.length - 1; i >= 0; i--) {
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, (size / 2) * (i + 1) / RING_POINTS.length, 0, Math.PI * 2);
        ctx.fillStyle = colors[i];
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#222';
        ctx.stroke();
      }
      ctx.fillStyle = '#222';
      ctx.font = 'bold 34px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 1; i < RING_POINTS.length; i++) {
        const r = (size / 2) * (i + 0.5) / RING_POINTS.length;
        ctx.fillStyle = colors[i] === '#ffffff' ? '#222' : '#fff';
        ctx.fillText(RING_POINTS[i], size / 2, size / 2 - r);
      }
      const t = new THREE.CanvasTexture(canvas);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();

    const targetFaceGeo = new THREE.CircleGeometry(TARGET_RADIUS, 48);
    const targetFaceMat = new THREE.MeshStandardMaterial({ map: targetTexture, roughness: 0.7 });
    const targetRimGeo = new THREE.CylinderGeometry(TARGET_RADIUS * 1.03, TARGET_RADIUS * 1.03, 0.03, 48);
    const targetRimMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6 });

    const targets = [];
    const hitMeshes = []; // Meshes, die per Raycast getroffen werden können

    function createTarget(position, scale, motion) {
      const group = new THREE.Group();
      const rim = new THREE.Mesh(targetRimGeo, targetRimMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.z = -0.016;
      group.add(rim);
      const face = new THREE.Mesh(targetFaceGeo, targetFaceMat);
      face.userData.target = group;
      group.add(face);
      group.position.copy(position);
      group.scale.setScalar(0.01); // fliegt auf
      group.userData = { face, base: position.clone(), scale, motion, age: 0, dying: false, dieTime: 0, spin: 0 };
      group.lookAt(playerHead.x, position.y, playerHead.z);
      scene.add(group);
      targets.push(group);
      hitMeshes.push(face);
      return group;
    }

    function removeTarget(group) {
      scene.remove(group);
      targets.splice(targets.indexOf(group), 1);
      const i = hitMeshes.indexOf(group.userData.face);
      if (i >= 0) hitMeshes.splice(i, 1);
    }

    // Spieler-Bezugssystem (wird beim Start einer Runde gesetzt)
    const playerHead = new THREE.Vector3(0, 1.6, 0);
    let playerYaw = 0; // Blickrichtung um die Y-Achse

    function updatePlayerFrame() {
      camera.updateMatrixWorld(true);
      const xrCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      xrCam.getWorldPosition(playerHead);
      const dir = new THREE.Vector3();
      xrCam.getWorldDirection(dir);
      dir.y = 0;
      if (dir.lengthSq() < 1e-4) dir.set(0, 0, -1);
      dir.normalize();
      playerYaw = Math.atan2(-dir.x, -dir.z);
    }

    function pointInFront(dist, angle, height) {
      const a = playerYaw + angle;
      return new THREE.Vector3(
        playerHead.x - Math.sin(a) * dist,
        height,
        playerHead.z - Math.cos(a) * dist
      );
    }

    function spawnTarget() {
      const difficulty = Math.min(1, (ROUND_TIME - timeLeft) / ROUND_TIME);
      let pos;
      for (let tries = 0; tries < 20; tries++) {
        const angle = THREE.MathUtils.randFloatSpread(THREE.MathUtils.degToRad(100));
        const dist = THREE.MathUtils.randFloat(2.2, 4 + difficulty * 2.5);
        const height = Math.max(0.5, playerHead.y + THREE.MathUtils.randFloat(-0.6, 0.6));
        pos = pointInFront(dist, angle, height);
        if (targets.every(t => t.position.distanceTo(pos) > 0.8)) break;
      }
      const scale = THREE.MathUtils.lerp(1.1, 0.65, difficulty) * THREE.MathUtils.randFloat(0.9, 1.1);
      const moving = Math.random() < 0.15 + difficulty * 0.7;
      const motion = moving ? {
        ampX: THREE.MathUtils.randFloat(0.4, 1.2),
        ampY: Math.random() < 0.4 ? THREE.MathUtils.randFloat(0.1, 0.35) : 0,
        speed: THREE.MathUtils.randFloat(0.6, 1.2 + difficulty * 1.5),
        phase: Math.random() * Math.PI * 2
      } : null;
      createTarget(pos, scale, motion);
    }

    // ---------------------------------------------------------------------------
    // Menü / Start-Scheibe / Anzeigetafel
    // ---------------------------------------------------------------------------
    const board = makePanel(1.2, 0.6, 700);
    scene.add(board.mesh);

    const startButton = new THREE.Group();
    {
      const plate = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.2, 0.04, 40),
        new THREE.MeshStandardMaterial({ color: 0x1fae52, emissive: 0x0a3a1a, roughness: 0.5 })
      );
      plate.rotation.x = Math.PI / 2;
      startButton.add(plate);
      const label = makePanel(0.36, 0.14, 800);
      label.draw((ctx, w, h) => {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 80px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('START', w / 2, h / 2 + 4);
      });
      label.mesh.position.z = 0.022;
      startButton.add(label.mesh);
      plate.userData.isStart = true;
      label.mesh.userData.isStart = true;
      startButton.userData.hit = [plate, label.mesh];
    }
    scene.add(startButton);

    function drawBoard() {
      const best = getHighscore();
      board.draw((ctx, w, h) => {
        roundRect(ctx, 0, 0, w, h, 40);
        ctx.fillStyle = 'rgba(12,16,24,0.82)';
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffcc33';
        ctx.stroke();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        if (state === 'menu') {
          ctx.font = 'bold 74px system-ui, sans-serif';
          ctx.fillText('🎯 Schießstand', w / 2, h * 0.2);
          ctx.font = '38px system-ui, sans-serif';
          ctx.fillStyle = '#cfd8e3';
          ctx.fillText(`Triff in ${ROUND_TIME} s so viele Scheiben wie möglich!`, w / 2, h * 0.42);
          ctx.fillText('Abzug = Schuss · Griff-Taste = Nachladen', w / 2, h * 0.56);
          ctx.fillStyle = '#ffcc33';
          ctx.font = 'bold 44px system-ui, sans-serif';
          ctx.fillText('Schieß auf START ⬇', w / 2, h * 0.74);
          ctx.fillStyle = '#9ad';
          ctx.font = '32px system-ui, sans-serif';
          ctx.fillText(`Rekord: ${best}`, w / 2, h * 0.9);
        } else if (state === 'playing') {
          ctx.font = 'bold 90px system-ui, sans-serif';
          ctx.fillText(`${score} Punkte`, w / 2, h * 0.32);
          ctx.font = 'bold 60px system-ui, sans-serif';
          ctx.fillStyle = timeLeft < 10 ? '#ff5a4a' : '#9ad';
          ctx.fillText(`⏱ ${Math.ceil(timeLeft)} s`, w / 2, h * 0.62);
          ctx.fillStyle = '#cfd8e3';
          ctx.font = '36px system-ui, sans-serif';
          const acc = shots ? Math.round(hits / shots * 100) : 0;
          ctx.fillText(`Treffer ${hits}/${shots} (${acc}%) · Combo x${combo}`, w / 2, h * 0.85);
        } else if (state === 'over') {
          ctx.font = 'bold 66px system-ui, sans-serif';
          ctx.fillText(score >= best && score > 0 ? '🏆 Neuer Rekord!' : 'Zeit abgelaufen!', w / 2, h * 0.17);
          ctx.font = 'bold 90px system-ui, sans-serif';
          ctx.fillStyle = '#ffcc33';
          ctx.fillText(`${score} Punkte`, w / 2, h * 0.38);
          ctx.fillStyle = '#cfd8e3';
          ctx.font = '38px system-ui, sans-serif';
          const acc = shots ? Math.round(hits / shots * 100) : 0;
          ctx.fillText(`Treffer ${hits} · Schüsse ${shots} · Genauigkeit ${acc}%`, w / 2, h * 0.56);
          ctx.fillText(`Volltreffer (10er): ${bullseyes} · Rekord: ${best}`, w / 2, h * 0.68);
          ctx.fillStyle = '#ffcc33';
          ctx.font = 'bold 44px system-ui, sans-serif';
          ctx.fillText('Nochmal? Schieß auf START ⬇', w / 2, h * 0.86);
        }
      });
    }

    function placeMenu() {
      updatePlayerFrame();
      const boardPos = pointInFront(2.2, 0, playerHead.y + 0.35);
      board.mesh.position.copy(boardPos);
      board.mesh.lookAt(playerHead.x, boardPos.y, playerHead.z);
      const btnPos = pointInFront(2.0, 0, playerHead.y - 0.3);
      startButton.position.copy(btnPos);
      startButton.lookAt(playerHead.x, btnPos.y, playerHead.z);
    }

    function getHighscore() {
      try { return parseInt(localStorage.getItem('vrspiel-highscore') || '0', 10); } catch { return 0; }
    }
    function setHighscore(v) {
      try { localStorage.setItem('vrspiel-highscore', String(v)); } catch { /* ignorieren */ }
    }

    // ---------------------------------------------------------------------------
    // Spielzustand
    // ---------------------------------------------------------------------------
    let state = 'menu';
    let score = 0, hits = 0, shots = 0, combo = 1, bullseyes = 0;
    let timeLeft = ROUND_TIME;
    let ammo = MAG_SIZE;
    let reloading = false;
    let reloadTimer = 0;
    let boardDirty = true;

    function startRound() {
      while (targets.length) removeTarget(targets[0]);
      updatePlayerFrame();
      state = 'playing';
      score = 0; hits = 0; shots = 0; combo = 1; bullseyes = 0;
      timeLeft = ROUND_TIME;
      ammo = MAG_SIZE; reloading = false;
      startButton.visible = false;
      // Anzeigetafel nach oben verschieben, damit sie nicht im Weg ist
      const boardPos = pointInFront(5, 0, playerHead.y + 1.3);
      board.mesh.position.copy(boardPos);
      board.mesh.lookAt(playerHead);
      board.mesh.scale.setScalar(1.6);
      for (let i = 0; i < MAX_TARGETS; i++) spawnTarget();
      playTone([523, 659, 784], 0.25, 0.25);
      boardDirty = true;
    }

    function endRound() {
      state = 'over';
      for (const t of [...targets]) explodeTarget(t);
      if (score > getHighscore()) setHighscore(score);
      board.mesh.scale.setScalar(1);
      placeMenu();
      startButton.visible = true;
      playTone([784, 659, 523, 392], 0.35, 0.25);
      boardDirty = true;
    }

    function reload() {
      if (reloading || ammo === MAG_SIZE) return;
      reloading = true;
      reloadTimer = RELOAD_TIME;
      playReload();
    }

    // ---------------------------------------------------------------------------
    // Schießen
    // ---------------------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const tmpOrigin = new THREE.Vector3();
    const tmpDir = new THREE.Vector3();
    const tmpQuat = new THREE.Quaternion();

    function shoot(controller) {
      const gun = controller ? gunVR : desktopGun;
      if (reloading) return;
      if (ammo <= 0) { playEmpty(); pulse(controller, 0.2, 30); return; }

      ammo--;
      if (state === 'playing') shots++;
      boardDirty = true;

      gun.userData.muzzle.getWorldPosition(tmpOrigin);
      if (controller) {
        controller.getWorldQuaternion(tmpQuat);
        tmpDir.set(0, 0, -1).applyQuaternion(tmpQuat).normalize();
      } else {
        raycaster.setFromCamera(mouseNdc, camera);
        tmpDir.copy(raycaster.ray.direction);
        // Am PC zielt der Strahl von der Kamera aus (Mauszeiger), Tracer startet an der Pistole
      }
      const rayOrigin = controller ? tmpOrigin : raycaster.ray.origin.clone();
      raycaster.set(rayOrigin, tmpDir);

      const candidates = startButton.visible ? [...hitMeshes, ...startButton.userData.hit] : hitMeshes;
      const hit = raycaster.intersectObjects(candidates, false)[0];

      // Effekte
      gun.userData.recoil = 1;
      playShot();
      pulse(controller, 0.9, 70);
      const end = hit ? hit.point.clone() : rayOrigin.clone().addScaledVector(tmpDir, 30);
      spawnTracer(tmpOrigin.clone(), end);

      if (!hit) {
        if (state === 'playing') combo = 1;
        return;
      }

      if (hit.object.userData.isStart) {
        burst(hit.point, 0x33ff77, 20);
        startRound();
        return;
      }

      const target = hit.object.userData.target;
      if (!target || target.userData.dying) return;

      // Punkte nach Ring berechnen (lokale Koordinaten der Scheibe)
      const local = hit.object.worldToLocal(hit.point.clone());
      const r = Math.min(0.999, Math.hypot(local.x, local.y) / TARGET_RADIUS);
      const ring = Math.floor(r * RING_POINTS.length);
      let pts = RING_POINTS[ring];
      if (target.userData.motion) pts += 2; // Bonus für bewegliche Ziele

      bulletHole(hit.object, local);
      if (state === 'playing') {
        hits++;
        if (ring === 0) bullseyes++;
        const gained = pts * combo;
        score += gained;
        floatingText(`+${gained}${combo > 1 ? ` (x${combo})` : ''}`, hit.point, ring === 0 ? '#ffd21f' : '#ffffff');
        combo = Math.min(5, combo + 1);
      }
      playHit(RING_POINTS[ring]);
      burst(hit.point, ring === 0 ? 0xffd21f : 0xff4433, ring === 0 ? 30 : 16);
      explodeTarget(target);
    }

    function pulse(controller, intensity, ms) {
      const src = controller && controller.userData.inputSource;
      const act = src && src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0];
      if (act && act.pulse) act.pulse(intensity, ms);
    }

    function explodeTarget(target) {
      if (target.userData.dying) return;
      target.userData.dying = true;
      target.userData.dieTime = 0;
      target.userData.spin = (Math.random() < 0.5 ? -1 : 1) * THREE.MathUtils.randFloat(6, 10);
      const i = hitMeshes.indexOf(target.userData.face);
      if (i >= 0) hitMeshes.splice(i, 1);
    }

    // ---------------------------------------------------------------------------
    // Effekte
    // ---------------------------------------------------------------------------
    const effects = []; // { obj, life, maxLife, update(dt, k) }

    const holeGeo = new THREE.CircleGeometry(0.012, 10);
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    function bulletHole(face, local) {
      const hole = new THREE.Mesh(holeGeo, holeMat);
      hole.position.set(local.x, local.y, 0.002);
      face.add(hole);
    }

    function spawnTracer(from, to) {
      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      const mat = new THREE.LineBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.9 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      effects.push({ obj: line, life: 0.08, maxLife: 0.08, update(dt, k) { mat.opacity = 0.9 * k; } });
    }

    const particleGeo = new THREE.BoxGeometry(0.02, 0.02, 0.02);
    function burst(point, color, count) {
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(particleGeo, mat);
        p.position.copy(point);
        const v = new THREE.Vector3().randomDirection().multiplyScalar(THREE.MathUtils.randFloat(1, 3));
        scene.add(p);
        effects.push({
          obj: p, life: 0.7, maxLife: 0.7,
          update(dt, k) {
            v.y -= 6 * dt;
            p.position.addScaledVector(v, dt);
            p.rotation.x += dt * 8; p.rotation.y += dt * 6;
            p.scale.setScalar(k);
            mat.opacity = k;
          }
        });
      }
    }

    function floatingText(text, point, color) {
      const panel = makePanel(0.5, 0.16, 600);
      panel.draw((ctx, w, h) => {
        ctx.font = 'bold 80px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 10;
        ctx.strokeStyle = 'rgba(0,0,0,0.8)';
        ctx.strokeText(text, w / 2, h / 2);
        ctx.fillStyle = color;
        ctx.fillText(text, w / 2, h / 2);
      });
      panel.mesh.position.copy(point);
      panel.mesh.lookAt(playerHead);
      scene.add(panel.mesh);
      effects.push({
        obj: panel.mesh, life: 1.0, maxLife: 1.0,
        update(dt, k) {
          panel.mesh.position.y += dt * 0.5;
          panel.mesh.material.opacity = Math.min(1, k * 2);
        },
        dispose() { panel.mesh.material.map.dispose(); panel.mesh.material.dispose(); }
      });
    }

    function updateEffects(dt) {
      for (let i = effects.length - 1; i >= 0; i--) {
        const e = effects[i];
        e.life -= dt;
        if (e.life <= 0) {
          scene.remove(e.obj);
          if (e.dispose) e.dispose();
          else if (e.obj.geometry && e.obj.geometry !== particleGeo) e.obj.geometry.dispose();
          effects.splice(i, 1);
        } else {
          e.update(dt, e.life / e.maxLife);
        }
      }
    }

    function updateGun(gun, dt) {
      const u = gun.userData;
      u.recoil = Math.max(0, u.recoil - dt * 8);
      const k = u.recoil * u.recoil;
      u.body.position.z = k * 0.04;
      u.body.rotation.x = k * 0.35;
      u.flash.visible = u.recoil > 0.6;
      u.flash.rotation.z = Math.random() * Math.PI;
      u.flashLight.intensity = u.recoil > 0.6 ? 3 : 0;
      if (reloading) u.body.rotation.z = Math.sin((1 - reloadTimer / RELOAD_TIME) * Math.PI) * 0.8;
      else u.body.rotation.z = 0;
    }

    // ---------------------------------------------------------------------------
    // Steuerung am PC (zum Testen ohne Brille)
    // ---------------------------------------------------------------------------
    const mouseNdc = new THREE.Vector2();
    let lookYaw = 0, lookPitch = 0;
    let dragging = false, dragMoved = 0, lastX = 0, lastY = 0;

    renderer.domElement.addEventListener('pointermove', (e) => {
      mouseNdc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      if (dragging) {
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        dragMoved += Math.abs(dx) + Math.abs(dy);
        lookYaw -= dx * 0.004;
        lookPitch = THREE.MathUtils.clamp(lookPitch - dy * 0.004, -1.2, 1.2);
        lastX = e.clientX; lastY = e.clientY;
      }
    });
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (renderer.xr.isPresenting) return;
      if (e.button === 2) { reload(); return; }
      dragging = true; dragMoved = 0; lastX = e.clientX; lastY = e.clientY;
      mouseNdc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (renderer.xr.isPresenting || e.button !== 0) return;
      dragging = false;
      if (dragMoved < 6) shoot(null); // Klick = Schuss, Ziehen = Umschauen
    });
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') reload(); });

    // ---------------------------------------------------------------------------
    // Hauptschleife
    // ---------------------------------------------------------------------------
    const clock = new THREE.Clock();
    let elapsed = 0;
    let lastDisplayKey = '';

    placeMenu();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;

      if (!renderer.xr.isPresenting) {
        camera.rotation.set(lookPitch, lookYaw, 0, 'YXZ');
      }

      if (reloading) {
        reloadTimer -= dt;
        if (reloadTimer <= 0) { reloading = false; ammo = MAG_SIZE; boardDirty = true; }
      }

      if (state === 'playing') {
        const prev = Math.ceil(timeLeft);
        timeLeft -= dt;
        if (Math.ceil(timeLeft) !== prev) {
          boardDirty = true;
          if (timeLeft <= 5 && timeLeft > 0) playTone([1000], 0.08, 0.15, 'square');
        }
        if (timeLeft <= 0) { timeLeft = 0; endRound(); }
        else {
          const alive = targets.filter(t => !t.userData.dying).length;
          for (let i = alive; i < MAX_TARGETS; i++) spawnTarget();
        }
      }

      // Zielscheiben animieren
      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        const u = t.userData;
        u.age += dt;
        if (u.dying) {
          u.dieTime += dt;
          t.rotation.y += u.spin * dt;
          t.position.y -= dt * u.dieTime * 4;
          t.scale.setScalar(u.scale * Math.max(0, 1 - u.dieTime * 2));
          if (u.dieTime > 0.5) removeTarget(t);
          continue;
        }
        // Aufploppen
        const pop = Math.min(1, u.age * 4);
        t.scale.setScalar(u.scale * (pop < 1 ? 1 - Math.pow(1 - pop, 3) * 1.0 + Math.sin(pop * Math.PI) * 0.15 : 1));
        if (u.motion) {
          const m = u.motion;
          const s = Math.sin(u.age * m.speed + m.phase);
          const right = new THREE.Vector3(1, 0, 0).applyQuaternion(t.quaternion);
          t.position.copy(u.base).addScaledVector(right, s * m.ampX);
          t.position.y = Math.max(0.4, u.base.y + Math.cos(u.age * m.speed * 1.3 + m.phase) * m.ampY);
        }
      }

      // Start-Knopf pulsiert
      if (startButton.visible) startButton.scale.setScalar(1 + Math.sin(elapsed * 4) * 0.05);

      updateGun(gunVR, dt);
      updateGun(desktopGun, dt);
      updateEffects(dt);

      const displayKey = `${state}|${score}|${Math.ceil(timeLeft)}|${ammo}|${reloading}`;
      if (displayKey !== lastDisplayKey) {
        lastDisplayKey = displayKey;
        drawGunDisplay(gunVR);
        drawGunDisplay(desktopGun);
      }
      if (boardDirty) { drawBoard(); boardDirty = false; }

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
