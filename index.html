    const effects = [];
    const debris = [];
    function addDebris(obj, vel, life, spin) {
      scene.add(obj);
      debris.push({ obj, vel, life, maxLife: life, ang: spin ? new THREE.Vector3().randomDirection().multiplyScalar(20) : new THREE.Vector3().randomDirection().multiplyScalar(3), bounced: 0, small: spin });
      if (debris.length > 60) { const d = debris.shift(); scene.remove(d.obj); }
    }
    function updateDebris(dt) {
      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.life -= dt;
        d.vel.y -= 9.81 * dt;
        d.obj.position.addScaledVector(d.vel, dt);
        d.obj.rotation.x += d.ang.x * dt;
        d.obj.rotation.y += d.ang.y * dt;
        d.obj.rotation.z += d.ang.z * dt;
        if (d.obj.position.y < 0.01 && d.vel.y < 0) {
          d.obj.position.y = 0.01;
          d.vel.y *= -0.3;
          d.vel.x *= 0.5; d.vel.z *= 0.5;
          d.ang.multiplyScalar(0.4);
          if (d.small && d.bounced < 2 && Math.abs(d.vel.y) > 0.3) SFX.casing();
          d.bounced++;
        }
        if (d.life < 0.5) d.obj.scale.setScalar(Math.max(0.001, d.life / 0.5));
        if (d.life <= 0) { scene.remove(d.obj); debris.splice(i, 1); }
      }
    }

    const holeGeo = new THREE.CircleGeometry(0.01, 10);
    const holeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    function bulletHole(face, local) {
      const hole = new THREE.Mesh(holeGeo, holeMat);
      hole.position.set(local.x, local.y, 0.002);
      face.add(hole);
    }
    function spawnTracer(from, to) {
      const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
      const mat = new THREE.LineBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.6 });
      const line = new THREE.Line(geo, mat);
      scene.add(line);
      effects.push({ obj: line, life: 0.06, maxLife: 0.06, update(dt, k) { mat.opacity = 0.6 * k; } });
    }
    const particleGeo = new THREE.BoxGeometry(0.02, 0.02, 0.02);
    function burst(point, color, count) {
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(particleGeo, mat);
        p.position.copy(point);
        const v = new THREE.Vector3().randomDirection().multiplyScalar(THREE.MathUtils.randFloat(1, 3));
        scene.add(p);
        effects.push({
          obj: p, life: 0.7, maxLife: 0.7,
          update(dt, k) {
            v.y -= 6 * dt;
            p.position.addScaledVector(v, dt);
            p.rotation.x += dt * 8; p.rotation.y += dt * 6;
            p.scale.setScalar(k);
            mat.opacity = k;
          }
        });
      }
    }
    function floatingText(text, point, color) {
      const panel = makePanel(0.5, 0.16, 600);
      panel.draw((ctx, w, h) => {
        ctx.font = 'bold 80px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 10;
        ctx.strokeStyle = 'rgba(0,0,0,0.8)';
        ctx.strokeText(text, w / 2, h / 2);
        ctx.fillStyle = color;
        ctx.fillText(text, w / 2, h / 2);
      });
      panel.mesh.position.copy(point);
      const dist = point.distanceTo(headPos);
      panel.mesh.scale.setScalar(Math.max(1, dist / 4));
      panel.mesh.lookAt(headPos);
      scene.add(panel.mesh);
      effects.push({
        obj: panel.mesh, life: 1.0, maxLife: 1.0,
        update(dt, k) {
          panel.mesh.position.y += dt * 0.5;
          panel.mesh.material.opacity = Math.min(1, k * 2);
        },
        dispose() { panel.mesh.material.map.dispose(); panel.mesh.material.dispose(); }
      });
    }
    function updateEffects(dt) {
      for (let i = effects.length - 1; i >= 0; i--) {
        const e = effects[i];
        e.life -= dt;
        if (e.life <= 0) {
          scene.remove(e.obj);
          if (e.dispose) e.dispose();
          else if (e.obj.geometry && e.obj.geometry !== particleGeo) e.obj.geometry.dispose();
          effects.splice(i, 1);
        } else e.update(dt, e.life / e.maxLife);
      }
    }

    // ---- Anzeige am Handgelenk der freien Hand ------------------------------
    // Erscheint nur, wenn man auf das Handgelenk schaut, und nie beim Zielen.
    const hud = makePanel(0.12, 0.05, 2800);
    hud.mesh.visible = false;
    hud.mesh.renderOrder = 5;
    scene.add(hud.mesh);
    let hudKey = '', hudAlpha = 0;
    function statusLines() {
      if (!W) return null;
      const d = W.def;
      const main = W.hand >= 0 ? hands[W.hand] : null;
      const off = offHand();
      const A = main ? btnName(main, 'a') : 'R', B = main ? btnName(main, 'b') : 'V';
      const desk = !renderer.xr.isPresenting;
      const modeName = { safe: 'GESICHERT', semi: d.modes.length > 2 ? 'EINZEL' : 'FEUER', auto: 'DAUERFEUER' }[mode()];
      const loaded = W.chamber === 'live' ? 1 : 0;
      const ammo = d.feed === 'mag' ? `${W.magInserted ? W.magRounds : '–'}/${d.capacity}+${loaded}` : `${W.tube}/${d.capacity}+${loaded}`;
      const line2 = `${ammo} · ${modeName}${d.sight === 'scope' ? ` · ${W.zoom.toFixed(0)}x` : ''}`;
      let hint = '';
      const holding = off && off.item;
      if (mode() === 'safe') hint = desk ? 'Gesichert – V: entsichern' : `Gesichert – ${B}: entsichern`;
      else if (d.feed === 'mag' && !W.magInserted) hint = desk ? 'R: nachladen' : holding ? 'Magazin von unten einschieben' : 'Magazin vom Gürtel holen';
      else if (d.feed === 'mag' && W.chamber !== 'live' && W.magRounds === 0) hint = desk ? 'Leer – R: nachladen' : `Leer – ${A}: Magazin raus`;
      else if (d.feed === 'tube' && W.chamber !== 'live' && W.tube === 0) hint = desk ? 'Leer – R: nachladen' : holding ? 'Patrone unten einführen' : 'Patronen vom Gürtel holen';
      else if (W.chamber !== 'live' || W.actionOpen) {
        if (desk) hint = 'Lade durch…';
        else if (d.action === 'slide') hint = `Schlitten ziehen (oder ${B})`;
        else if (d.action === 'charge') hint = 'Spannhebel zurückziehen';
        else if (d.action === 'pump') hint = 'Vorderschaft zurück & vor';
        else hint = 'Kammerstängel zurück & vor';
      } else if (holding && d.feed === 'tube' && W.tube < d.capacity) hint = 'Patrone unten einführen';
      return { title: d.name, line2, hint };
    }
    function updateHud(dt) {
      const s = statusLines();
      if (!renderer.xr.isPresenting) {
        statusEl.style.display = s ? 'block' : 'none';
        if (s) statusEl.textContent = `${s.title}\n${s.line2}${s.hint ? '\n➜ ' + s.hint : ''}`;
        hud.mesh.visible = false;
        return;
      }
      statusEl.style.display = 'none';
      const off = offHand();
      if (!s || !off || !off.src) { hud.mesh.visible = false; hudAlpha = 0; return; }
      // auf dem Handgelenk (hinter dem Controller)
      off.ray.getWorldQuaternion(tmpQ);
      hud.mesh.position.copy(off.point).add(tmpV.set(0, 0.035, 0.1).applyQuaternion(tmpQ));
      hud.mesh.lookAt(headPos);
      // nur sichtbar, wenn man hinschaut
      getViewCamera().getWorldDirection(tmpV2);
      const look = tmpV3.copy(hud.mesh.position).sub(headPos).normalize().dot(tmpV2);
      let target = THREE.MathUtils.smoothstep(look, Math.cos(0.55), Math.cos(0.3));
      if (W.twoHanding || W.aligned) target = 0;
      hudAlpha = THREE.MathUtils.damp(hudAlpha, target, 12, dt);
      hud.mesh.material.opacity = hudAlpha;
      hud.mesh.visible = hudAlpha > 0.02;
      const key = JSON.stringify(s);
      if (key === hudKey) return;
      hudKey = key;
      hud.draw((ctx, w, h) => {
        panelBg(ctx, w, h, 22, s.hint ? '#ffcc33' : '#55ff77');
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 34px system-ui, sans-serif';
        ctx.fillText(s.line2, 18, h * 0.3);
        ctx.fillStyle = s.hint ? '#ffcc33' : '#9ad';
        ctx.font = 'bold 26px system-ui, sans-serif';
        ctx.fillText(s.hint || s.title, 18, h * 0.7);
      });
    }

    // ---- Visiere: Rotpunkt & Zielfernrohr ----------------------------------
    // Prüft für jedes Auge, wie gut es hinter dem Visier liegt; das besser ausgerichtete Auge zählt
    const eyePositions = [new THREE.Vector3(), new THREE.Vector3()];
    function eyeAlignment(lensSocket, axis) {
      lensSocket.getWorldPosition(tmpV2);
      const cams = renderer.xr.isPresenting ? renderer.xr.getCamera().cameras : [];
      const eyes = cams.length ? cams.map((c, i) => c.getWorldPosition(eyePositions[i])) : [headPos];
      let best = { along: -1, perp: Infinity, eye: headPos };
      for (const eye of eyes) {
        const toLens = tmpV2.clone().sub(eye);
        const along = toLens.dot(axis);
        const perp = toLens.addScaledVector(axis, -along).length();
        if (along > 0 && perp < best.perp) best = { along, perp, eye };
      }
      return best;
    }

    // Kamerabild der Quest für das Zielfernrohr (optional, falls der Browser es erlaubt)
    const CAM_HFOV = THREE.MathUtils.degToRad(72); // ungefähres Sichtfeld der Passthrough-Kamera
    let camVideo = null, camTex = null;
    const camBtn = document.getElementById('camBtn');
    async function startCamera() {
      if (camTex || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
        camVideo = document.createElement('video');
        camVideo.muted = true;
        camVideo.playsInline = true;
        camVideo.srcObject = stream;
        await camVideo.play();
        camTex = new THREE.VideoTexture(camVideo);
        camTex.colorSpace = THREE.SRGBColorSpace;
        camBtn.textContent = '📷 Kamera fürs Zielfernrohr aktiv';
      } catch (e) {
        camBtn.textContent = '📷 Kamera nicht verfügbar – Zielfernrohr zeigt den Raum durchs Glas';
      }
    }
    camBtn.addEventListener('click', startCamera);
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'camera' }).then(r => { if (r.state === 'granted') startCamera(); }).catch(() => {});
    }

    function updateSights() {
      redDot.visible = false;
      if (!W || !W.root.parent || (renderer.xr.isPresenting && W.hand < 0)) { if (W) W.aligned = false; return; }
      const axis = W.sockets.sightFront.getWorldPosition(new THREE.Vector3()).sub(W.sockets.sightRear.getWorldPosition(tmpV3)).normalize();
      const iron = eyeAlignment(W.sockets.sightRear, axis);
      W.aligned = iron.along > 0 && iron.along < 0.5 && iron.perp < 0.05;
      if (W.def.sight === 'reddot') {
        const a = eyeAlignment(W.sockets.dotLens, axis);
        if (a.along > 0 && a.along < 0.7 && a.perp < 0.016) {
          redDot.visible = true;
          redDot.position.copy(a.eye).addScaledVector(axis, 40);
          redDot.scale.setScalar(0.14);
        }
      } else if (W.def.sight === 'scope') {
        const P = W.parts;
        const a = eyeAlignment(W.sockets.scopeEye, axis);
        // Austrittspupille: neben der Achse wird es dunkel
        const k = a.along > 0 ? THREE.MathUtils.clamp(1 - (a.perp - 0.008) / 0.02, 0, 1) : 0;
        if (a.along < 0.6 && a.perp < 0.06) W.aligned = true;
        P.lensShade.material.opacity = 1 - k;
        const xr = renderer.xr.isPresenting;
        const useVideo = xr && camTex && camVideo.videoWidth > 0;
        P.lensVideo.visible = !!useVideo;
        P.lensHole.visible = xr && !useVideo; // „Loch“: zeigt den echten Raum durchs Glas
        if (k > 0 && a.along < 0.6) {
          const fovDeg = 24 / W.zoom;
          W.sockets.scopeCam.getWorldPosition(scopeCam.position);
          W.body.getWorldQuaternion(scopeCam.quaternion);
          scopeCam.fov = fovDeg;
          scopeCam.updateProjectionMatrix();
          scopeCam.updateMatrixWorld(true);
          const prevTarget = renderer.getRenderTarget();
          const prevBg = scene.background;
          renderer.xr.enabled = false;
          scene.background = xr ? null : scopeBackground; // in VR: durchsichtig, nur Ziele werden vergrößert eingeblendet
          W.root.visible = false;
          const hudVis = hud.mesh.visible;
          hud.mesh.visible = false;
          renderer.setRenderTarget(scopeRT);
          renderer.clear();
          renderer.render(scene, scopeCam);
          renderer.setRenderTarget(prevTarget);
          W.root.visible = true;
          hud.mesh.visible = hudVis;
          scene.background = prevBg;
          renderer.xr.enabled = true;
          if (useVideo) {
            // Passenden, vergrößerten Ausschnitt aus dem Kamerabild wählen
            if (P.lensVideo.material.map !== camTex) { P.lensVideo.material.map = camTex; P.lensVideo.material.needsUpdate = true; }
            getViewCamera().getWorldQuaternion(tmpQ);
            const d = axis.clone().applyQuaternion(tmpQ.invert());
            const tx = Math.tan(CAM_HFOV / 2), ty = tx * camVideo.videoHeight / camVideo.videoWidth;
            const half = Math.tan(THREE.MathUtils.degToRad(fovDeg / 2));
            if (d.z < -0.2) {
              const u = 0.5 + (d.x / -d.z) / (2 * tx), v = 0.5 + (d.y / -d.z) / (2 * ty);
              camTex.repeat.set(half / tx, half / ty);
              camTex.offset.set(u - camTex.repeat.x / 2, v - camTex.repeat.y / 2);
            }
          }
        }
      }
    }

    // =========================================================================
    // Steuerung am PC (zum Testen ohne Brille)
    // =========================================================================
    const mouseNdc = new THREE.Vector2();
    let lookYaw = 0, lookPitch = -0.25, rightDrag = false, lastX = 0, lastY = 0, leftDown = false, aiming = false;
    renderer.domElement.addEventListener('pointermove', (e) => {
      mouseNdc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      crosshairEl.style.left = e.clientX + 'px';
      crosshairEl.style.top = e.clientY + 'px';
      if (rightDrag) {
        lookYaw -= (e.clientX - lastX) * 0.004;
        lookPitch = THREE.MathUtils.clamp(lookPitch - (e.clientY - lastY) * 0.004, -1.2, 1.2);
        lastX = e.clientX; lastY = e.clientY;
      }
    });
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (renderer.xr.isPresenting) return;
      mouseNdc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
      if (e.button === 2) { rightDrag = true; lastX = e.clientX; lastY = e.clientY; return; }
      if (e.button !== 0) return;
      // Waffenwand anklicken
      if (rack.visible) {
        raycaster.setFromCamera(mouseNdc, camera);
        const it = rackItems.find(r => raycaster.ray.intersectsBox(r.box));
        if (it) { equip(it.id, -1); return; }
      }
      leftDown = true;
      if (W && W.cooldown <= 0 && !W.desktopBusy) desktopShoot();
    });
    window.addEventListener('pointerup', (e) => { if (e.button === 2) rightDrag = false; if (e.button === 0) leftDown = false; });
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
    renderer.domElement.addEventListener('wheel', (e) => { if (W && W.def.sight === 'scope') W.zoom = THREE.MathUtils.clamp(W.zoom - Math.sign(e.deltaY), 4, 12); boardDirty = true; });
    window.addEventListener('keydown', (e) => {
      if (renderer.xr.isPresenting) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 4 && state !== 'playing') equip(WEAPON_ORDER[n - 1], -1);
      if (e.key === 'f' || e.key === 'F') desktopThrowKnife();
      if (!W) return;
      if (e.key === 'r' || e.key === 'R') desktopReload();
      if (e.key === 'v' || e.key === 'V') toggleMode();
      if (e.code === 'Space') { aiming = !aiming; e.preventDefault(); }
    });
    function desktopThrowKnife() {
      raycaster.setFromCamera(mouseNdc, camera);
      const k = makeKnife();
      k.position.copy(raycaster.ray.origin).addScaledVector(raycaster.ray.direction, 0.3).add(new THREE.Vector3(0, -0.1, 0));
      scene.add(k);
      launchKnife(k, aimAssist(k.position, raycaster.ray.direction.clone().multiplyScalar(11)));
    }
    function desktopShoot() {
      let ray = null;
      if (!aiming) { raycaster.setFromCamera(mouseNdc, camera); ray = raycaster.ray.clone(); }
      if (tryFire(ray)) desktopAfterShot();
    }
    function updateWeaponDesktop(dt) {
      W.aim = THREE.MathUtils.damp(W.aim, aiming ? 1 : 0, 12, dt);
      // Hüfte: zeigt auf den Mauszeiger
      raycaster.setFromCamera(mouseNdc, camera);
      const dirCam = raycaster.ray.direction.clone().transformDirection(camera.matrixWorldInverse);
      const hipQ = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, -1), dirCam);
      const hipP = new THREE.Vector3(0.16, -0.17, -0.42);
      // Zielen: Visierlinie liegt auf der Kamera-Achse
      const eyeDist = W.def.sight === 'scope' ? 0.075 : W.def.sight === 'reddot' ? 0.2 : 0.32;
      const adsP = new THREE.Vector3(0, 0, -eyeDist).sub(W.restSightRear);
      W.root.position.lerpVectors(hipP, adsP, W.aim);
      W.root.quaternion.slerpQuaternions(hipQ, new THREE.Quaternion(), W.aim);
      const fov = aiming ? (W.def.sight === 'scope' ? 60 : 55) : 70;
      if (Math.abs(camera.fov - fov) > 0.1) { camera.fov = THREE.MathUtils.damp(camera.fov, fov, 10, dt); camera.updateProjectionMatrix(); }
      crosshairEl.style.display = aiming ? 'none' : 'block';
      if (leftDown && mode() === 'auto' && W.cooldown <= 0 && W.chamber === 'live') desktopShoot();
    }

    // =========================================================================
    // Hauptschleife
    // =========================================================================
    const clock = new THREE.Clock();
    let elapsed = 0;
    placeMenu();
    drawBoard();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;
      const xr = renderer.xr.isPresenting;

      if (!xr) camera.rotation.set(lookPitch, lookYaw, 0, 'YXZ');
      camera.updateMatrixWorld(true);
      getViewCamera().getWorldPosition(headPos);
      for (const h of hands) h.ray.updateMatrixWorld(true);

      // Zeitgesteuerte Aktionen
      for (let i = timers.length - 1; i >= 0; i--) {
        timers[i].t -= dt;
        if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); }
      }

      updateBelt(dt);
      if (xr) {
        // Menü neu ausrichten, falls der Spieler sich weit davon entfernt hat
        if (state !== 'playing' && headPos.distanceTo(playerHead) > 1.0) placeMenu();
        readInputs();
        updateHandsXR();
        if (W && W.hand >= 0 && hands[W.hand].src) { updateWeaponXR(dt); W.root.visible = true; }
        else if (W) W.root.visible = false;
      } else {
        for (const it of rackItems) drawRackLabel(it, W && W.id === it.id, false);
        if (W) updateWeaponDesktop(dt);
      }
      if (W) updateWeaponVisuals(dt);
      updateLoose(dt);
      updateKnives(dt);

      if (state === 'playing') {
        const prev = Math.ceil(timeLeft);
        timeLeft -= dt;
        if (Math.ceil(timeLeft) !== prev) {
          boardDirty = true;
          if (timeLeft <= 5 && timeLeft > 0) SFX.beep();
        }
        if (timeLeft <= 0) { timeLeft = 0; endRound(); }
        else {
          const alive = targets.filter(t => !t.userData.dying).length;
          for (let i = alive; i < MAX_TARGETS; i++) spawnTarget();
        }
      }

      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        const u = t.userData;
        u.age += dt;
        if (u.dying) {
          u.dieTime += dt;
          t.rotation.y += u.spin * dt;
          t.position.y -= dt * u.dieTime * 4;
          t.scale.setScalar(u.scale * Math.max(0, 1 - u.dieTime * 2));
          if (u.dieTime > 0.5) removeTarget(t);
          continue;
        }
        const pop = Math.min(1, u.age * 4);
        t.scale.setScalar(u.scale * (1 - Math.pow(1 - pop, 3) + Math.sin(pop * Math.PI) * 0.15));
        if (u.motion) {
          const m = u.motion;
          const s = Math.sin(u.age * m.speed + m.phase);
          const right = tmpV.set(1, 0, 0).applyQuaternion(t.quaternion);
          t.position.copy(u.base).addScaledVector(right, s * m.ampX);
          t.position.y = Math.max(0.4, u.base.y + Math.cos(u.age * m.speed * 1.3 + m.phase) * m.ampY);
        }
      }

      if (startButton.visible) startButton.scale.setScalar(1 + Math.sin(elapsed * 4) * 0.05);
      updateEffects(dt);
      updateDebris(dt);
      updateHud(dt);
      if (boardDirty) { drawBoard(); boardDirty = false; }

      scene.updateMatrixWorld();
      updateSights();
      renderer.render(scene, camera);
    });

    // Für automatisierte Tests
    window.__game = {
      get W() { return W; }, get state() { return state; }, equip, desktopReload, hands, rackItems, beltSlots, knives, looseWeapons, belt,
      startPos: () => startButton.getWorldPosition(new THREE.Vector3()),
      forceMenu: () => { if (state === 'playing') { timeLeft = 0.001; } }
    };
  </script>
</body>
</html>
